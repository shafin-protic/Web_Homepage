<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shafin's Space</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000' rx='24'/%3E%3Cpath fill='%233b82f6' d='M30 30h40a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V34a4 4 0 0 1 4-4zm5 12v20h30V42H35z'/%3E%3Ccircle cx='68' cy='36' r='3.5' fill='%23facc15'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }
        .hide-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem 1.5rem;
            gap: 1rem;
            overflow: hidden;
        }
        
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .title-section {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            border: 2px solid #3b82f6;
        }
        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .page-title .name-part { color: #fef08a; }
        .page-title .space-part { color: #a5f3fc; margin-left: 0.35rem; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            position: relative;
        }

        /* === WORK HOUR WIDGET === */
        .work-widget {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 0.9rem;
            padding: 0.35rem 0.7rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .work-widget.working {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
        }
        .work-widget.off { border-color: rgba(107, 114, 128, 0.25); }
        .work-widget.holiday { border-color: rgba(16, 185, 129, 0.25); }
        .work-day-tile {
            width: 42px;
            height: 42px;
            border-radius: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #ffffff;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.4s ease;
        }
        .work-day-tile .tile-pct { font-size: 0.72rem; letter-spacing: -0.2px; }
        .work-day-tile .tile-label {
            font-size: 0.42rem;
            font-weight: 600;
            opacity: 0.9;
            letter-spacing: 0.4px;
            margin-top: 0.08rem;
            text-transform: uppercase;
        }
        .work-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 100px; }
        .work-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            line-height: 1.15;
        }
        .work-status {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: #34d399;
        }
        .work-status i { font-size: 0.5rem; }
        .work-widget.off .work-status { color: #9ca3af; }
        .work-widget.holiday .work-status { color: #34d399; }
        .work-timer {
            font-family: monospace;
            font-size: 0.62rem;
            font-weight: 600;
            color: #ffffff;
        }
        .work-progress {
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .work-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #059669, #10b981, #34d399);
            border-radius: 2px;
            transition: width 0.6s ease;
        }
        .work-widget.off .work-progress-fill {
            background: linear-gradient(90deg, #374151, #4b5563);
        }
        .work-widget.holiday .work-progress-fill {
            background: linear-gradient(90deg, #059669, #10b981);
            opacity: 0.5;
        }
        .work-bottom-row {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: #6b7280;
            line-height: 1.1;
        }
        .work-hours-label { display: flex; align-items: center; gap: 0.22rem; }
        .work-hours-label i { font-size: 0.48rem; color: #4b5563; }

        /* === SALAH WIDGET === */
        .salah-widget {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 0.9rem;
            padding: 0.35rem 0.7rem;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            min-width: 200px;
            cursor: pointer;
            user-select: none;
        }
        .salah-widget:hover {
            background: #0f0f0f;
        }
        .salah-widget.active {
            border-color: rgba(16, 185, 129, 0.35);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.12);
        }
        .salah-widget.warning {
            border-color: rgba(250, 204, 21, 0.4);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.15);
        }
        .salah-widget.forbidden {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.25);
            animation: forbiddenPulse 2s ease-in-out infinite;
        }
        @keyframes forbiddenPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.55); border-color: rgba(239, 68, 68, 0.85); }
        }
        .salah-icon-tile {
            width: 38px;
            height: 38px;
            border-radius: 0.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #ffffff;
            font-size: 1rem;
            transition: background 0.4s ease;
        }
        .salah-icon-tile.active {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }
        .salah-icon-tile.warning {
            background: linear-gradient(135deg, #ca8a04, #facc15);
            color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(250, 204, 21, 0.35);
        }
        .salah-icon-tile.forbidden {
            background: linear-gradient(135deg, #b91c1c, #ef4444);
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
            animation: iconBlink 1s ease-in-out infinite;
        }
        @keyframes iconBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }
        .salah-info {
            display: flex;
            flex-direction: column;
            gap: 0.22rem;
            flex: 1;
            min-width: 0;
        }
        .salah-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            line-height: 1.1;
        }
        .salah-name {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .salah-name.active { color: #34d399; }
        .salah-name.warning { color: #facc15; }
        .salah-name.forbidden { color: #ef4444; }
        .salah-name i { font-size: 0.55rem; }
        .salah-countdown {
            font-family: monospace;
            font-size: 0.66rem;
            font-weight: 700;
            color: #ffffff;
        }
        .salah-widget.warning .salah-countdown { color: #fde047; }
        .salah-widget.forbidden .salah-countdown { color: #fca5a5; }
        .salah-progress {
            height: 4px;
            background: #1a1a1a;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .salah-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #059669, #10b981, #34d399);
            border-radius: 3px;
            transition: width 0.8s ease, background 0.5s ease;
        }
        .salah-widget.warning .salah-progress-fill {
            background: linear-gradient(90deg, #ca8a04, #facc15, #fde047);
        }
        .salah-widget.forbidden .salah-progress-fill {
            background: linear-gradient(90deg, #b91c1c, #ef4444, #f87171);
            animation: progressShimmer 1.2s linear infinite;
        }
        @keyframes progressShimmer {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .salah-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.52rem;
            color: #6b7280;
            line-height: 1.1;
        }
        .salah-time-range {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-family: monospace;
        }
        .salah-time-range i { font-size: 0.45rem; color: #4b5563; }

        /* === SALAH POPUP === */
        .salah-popup {
            position: fixed;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 1rem;
            padding: 0.6rem;
            min-width: 300px;
            max-width: 340px;
            z-index: 10003;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }
        .salah-popup-header {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.5rem 0.55rem;
            border-bottom: 1px solid #1e1e1e;
            margin-bottom: 0.4rem;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #9ca3af;
        }
        .salah-popup-header i { color: #3b82f6; font-size: 0.7rem; }
        .salah-popup-header .popup-loc {
            margin-left: auto;
            font-size: 0.55rem;
            font-weight: 500;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            text-transform: none;
            letter-spacing: 0;
        }
        .salah-popup-header .popup-loc i { color: #3b82f6; font-size: 0.55rem; }
        .salah-popup-list {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .salah-popup-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 0.55rem;
            border-radius: 0.55rem;
            transition: background 0.15s ease;
        }
        .salah-popup-row.current {
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.14), rgba(16, 185, 129, 0.04));
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .salah-popup-row.forbidden-row {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
        .salah-popup-icon {
            width: 30px;
            height: 30px;
            border-radius: 0.45rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.82rem;
            color: #9ca3af;
            background: #141414;
        }
        .salah-popup-row.current .salah-popup-icon {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
        }
        .salah-popup-row.forbidden-row .salah-popup-icon {
            background: linear-gradient(135deg, #b91c1c, #ef4444);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
        }
        .salah-popup-info {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            flex: 1;
            min-width: 0;
        }
        .salah-popup-name {
            font-size: 0.74rem;
            font-weight: 600;
            color: #e5e7eb;
            letter-spacing: 0.2px;
        }
        .salah-popup-row.current .salah-popup-name { color: #34d399; }
        .salah-popup-row.forbidden-row .salah-popup-name { color: #f87171; }
        .salah-popup-range {
            font-size: 0.55rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 0.28rem;
            font-family: monospace;
            letter-spacing: 0.1px;
        }
        .salah-popup-range i {
            font-size: 0.4rem;
            color: #4b5563;
        }
        .salah-popup-row.current .salah-popup-range { color: #6ee7b7; }
        .salah-popup-row.current .salah-popup-range i { color: #34d399; }
        .salah-popup-row.forbidden-row .salah-popup-range { color: #fca5a5; }
        .salah-popup-row.forbidden-row .salah-popup-range i { color: #ef4444; }
        .salah-popup-divider {
            height: 1px;
            background: #1a1a1a;
            margin: 0.35rem 0.3rem;
        }
        .salah-popup-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0.55rem 0.2rem;
            border-top: 1px solid #1e1e1e;
            margin-top: 0.35rem;
            font-size: 0.5rem;
            color: #6b7280;
        }
        .salah-popup-footer .method-label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .salah-popup-footer .method-label i { color: #3b82f6; font-size: 0.5rem; }

        .clock-date { text-align: right; }
        .clock { font-size: 1.2rem; font-weight: 600; font-family: monospace; }
        .date { font-size: 0.65rem; color: #9ca3af; }
        .icon-btn {
            background: #1f2937;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: #374151; transform: scale(1.05); }
        
        .calendar-popup {
            position: fixed;
            background: #111;
            border: 1px solid #333;
            border-radius: 1rem;
            padding: 1rem;
            width: 320px;
            z-index: 10001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .calendar-header button {
            background: #1f2937;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
        }
        .calendar-header button:hover { background: #374151; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 0.3rem;
        }
        .calendar-weekday { font-size: 0.7rem; color: #9ca3af; padding: 0.3rem; }
        .calendar-day {
            padding: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 0.5rem;
            position: relative;
        }
        .calendar-day:hover { background: #1f2937; }
        .friday-sat { color: #ef4444; }
        .current-day { background: #3b82f6; color: white; }
        
        /* === SEARCH WRAPPER === */
        .search-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            padding: 0.5rem 0;
            gap: 0.6rem;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .folders-bar {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-shrink: 0;
        }
        .folder-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            position: relative;
        }
        .folder-btn:hover {
            transform: translateY(-2px);
            background: #1a1a1a;
            border-color: #3b82f6;
        }
        .folder-btn.active {
            border-color: #3b82f6;
            background: #111a2e;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.35);
        }
        .folder-btn i { font-size: 1.05rem; }
        .folder-popup {
            position: fixed;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 1rem;
            padding: 0.7rem;
            min-width: 220px;
            max-width: 320px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 10002;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            scrollbar-width: none;
        }
        .folder-popup::-webkit-scrollbar { display: none; }
        .folder-popup-header {
            font-size: 0.7rem;
            font-weight: 600;
            color: #9ca3af;
            padding: 0.2rem 0.5rem 0.5rem;
            border-bottom: 1px solid #1e1e1e;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .folder-popup-header i { color: #3b82f6; }
        .folder-popup-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.6rem;
            border-radius: 0.6rem;
            text-decoration: none;
            color: #e5e7eb;
            font-size: 0.75rem;
            font-weight: 500;
            transition: background 0.12s;
        }
        .folder-popup-item:hover { background: #1f2937; }
        .folder-popup-item img {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
            object-fit: contain;
        }
        .folder-popup-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-container {
            display: flex;
            align-items: center;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 2.5rem;
            padding: 0.3rem 0.5rem;
            transition: border-color 0.2s, background 0.2s;
            flex: 1;
            max-width: 720px;
            position: relative;
        }
        .search-container:focus-within {
            border-color: #3b82f6;
            background: #050505;
        }
        .engine-icon-display {
            background: transparent;
            border: none;
            margin-left: 0.3rem;
            margin-right: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 2rem;
            transition: background 0.2s;
            position: relative;
            z-index: 5;
        }
        .engine-icon-display:hover { background: #1f2937; }
        .engine-icon-display img {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            pointer-events: none;
        }
        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 0.6rem 0.8rem;
            outline: none;
            min-width: 0;
        }
        .search-container input::placeholder { color: #4b5563; }
        .search-container .search-go-btn {
            background: #0d9488;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .search-container .search-go-btn:hover { background: #0f766e; }
        
        .dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 1rem;
            z-index: 1000;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            text-decoration: none;
            color: #e5e7eb;
            transition: background 0.1s;
        }
        .dropdown-item:hover, .dropdown-item.highlighted { background: #1f2937; }
        .dropdown-item img { width: 20px; height: 20px; border-radius: 4px; }
        .dropdown-item .shortcut-info { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
        .dropdown-item .shortcut-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropdown-item .shortcut-folder { font-size: 0.62rem; color: #6b7280; display: flex; align-items: center; gap: 0.3rem; }
        .dropdown-item .shortcut-folder i { font-size: 0.55rem; }

        /* === CATEGORIES === */
        .categories-section { flex: 1; overflow-y: auto; }
        .category-row { margin-bottom: 1.5rem; content-visibility: auto; contain-intrinsic-size: 0 120px; }

            font-size: 0.85rem;

<body>

<script>
    // ==================== CONFIG ====================
    const CSV_BOOKMARKS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=26452786&single=true&output=csv";
    const SEARCH_ENGINES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=1271015321&single=true&output=csv";
    const FOLDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=1505176942&single=true&output=csv";
    const EDIT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1ErgYkvSzc1CtNPGYAjMV4TeQqMH6tEV-l7DPT6faBPQ/edit?usp=sharing";

    const CACHE_KEY_CATEGORIES = 'shafin_categories_v3';
    const CACHE_KEY_SEARCH_ENGINES = 'shafin_search_engines_v3';
    const CACHE_KEY_FOLDERS = 'shafin_folders_v1';
    const CACHE_DURATION = 24 * 60 * 60 * 1000;

    const PRAYER_LAT = 22.35425;
    const PRAYER_LNG = 90.34141;
    const PRAYER_TIMEZONE = 6;
    const LOCATION_NAME = "Patuakhali";

    const WORK_DAYS = [1, 2, 3, 4];
    const WORK_START_HOUR = 9;
    const WORK_END_HOUR = 16;
    const DAY_NAMES_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    const GREEN_TILE_COLORS = [
        '#059669', '#10b981', '#0d9488', '#14b8a6',
        '#16a34a', '#22c55e', '#0f766e', '#047857',
        '#15803d', '#065f46'
    ];
    function getDayTileColor(dateKey) {
        let hash = 0;
        for (let i = 0; i < dateKey.length; i++) {
            hash = ((hash << 5) - hash) + dateKey.charCodeAt(i);
            hash |= 0;
        }
        return GREEN_TILE_COLORS[Math.abs(hash) % GREEN_TILE_COLORS.length];
    }

    const FOLDER_COLORS = [
        '#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6',
        '#ec4899','#06b6d4','#f97316','#84cc16','#14b8a6',
        '#a855f7','#eab308','#0ea5e9','#f43f5e','#22c55e'
    ];

    // Icons: use only Font Awesome 6 Free solid icons that are guaranteed available.
    // Maghrib: use fa-cloud-moon (sunset scene), since fa-sunset is a Pro icon.
    const WAKTH_META = {
        fajr:    { name: 'Fajr',    icon: 'fa-moon',       sub: 'Dawn' },
        dhuhr:   { name: 'Dhuhr',   icon: 'fa-sun',        sub: 'Noon' },
        asr:     { name: 'Asr',     icon: 'fa-cloud-sun',  sub: 'Afternoon' },
        maghrib: { name: 'Maghrib', icon: 'fa-cloud-moon', sub: 'Sunset' },
        isha:    { name: 'Isha',    icon: 'fa-star',       sub: 'Night' }
    };

    // ==================== STATE ====================
    let csvCategoryBookmarks = [];
    let searchEngines = [];
    let foldersData = [];
    let currentEngine = null;
    let isDropdownOpen = false;
    let highlightedSuggestionIdx = -1;
    let currentSuggestions = [];
    let activeFolderPopup = null;
    let activeFolderBtn = null;
    let activeCalendar = null;
    let activeSalahPopup = null;
    let cachedPrayerDay = null;
    let cachedTimes = null;
    let lastSalahState = null;

    const dom = {};

    // ==================== UTILITIES ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function getFaviconUrl(url) {
        try { const domain = new URL(url).hostname; return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`; } catch(e) { return ""; }
    }

    function getFolderColor(folderName) {
        let hash = 0;
        for (let i = 0; i < folderName.length; i++) {
            hash = ((hash << 5) - hash) + folderName.charCodeAt(i);
            hash |= 0;
        }
        return FOLDER_COLORS[Math.abs(hash) % FOLDER_COLORS.length];
    }

    function format12Hour(hours24) {
        let h = Math.floor(hours24);
        let m = Math.floor((hours24 - h) * 60);
        if (m === 60) { m = 0; h += 1; }
        if (h >= 24) h -= 24;
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
    }

    function parseCSV(text) {
        const rows = [];
        const lines = text.split(/\r?\n/);
        for (const line of lines) {
            if (!line.trim()) continue;
            const parts = [];
            let inQuote = false, current = '';
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    if (inQuote && line[i+1] === '"') { current += '"'; i++; }
                    else inQuote = !inQuote;
                }
                else if (c === ',' && !inQuote) { parts.push(current); current = ''; }
                else { current += c; }
            }
            parts.push(current);
            rows.push(parts.map(p => p.trim()));
        }
        return rows;
    }

    async function fetchCSV(url, cacheKey, forceRefresh = false) {
        if (!forceRefresh) {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) return data;
                } catch(e) {}
            }
        }
        const res = await fetch(url);
        const text = await res.text();
        localStorage.setItem(cacheKey, JSON.stringify({ data: text, timestamp: Date.now() }));
        return text;
    }

    // ==================== DATA LOADERS ====================
    async function loadCsvCategoryBookmarks(forceRefresh = false) {
        try {
            const text = await fetchCSV(CSV_BOOKMARKS_URL, CACHE_KEY_CATEGORIES, forceRefresh);
            const rows = parseCSV(text);
            const data = [];
            for (let i = 1; i < rows.length; i++) {
                const parts = rows[i];
                if (parts.length >= 3) {
                    const name = parts[0], url = parts[1];
                    const category = parts[2] || "Uncategorized";
                    const customIcon = parts[3] || "";
                    if (name && url && url.startsWith("http")) {
                        data.push({ name, url, category: category.trim(), customIcon });
                    }
                }
            }
            return data;
        } catch(e) { console.error(e); return []; }
    }

    async function loadSearchEngines(forceRefresh = false) {
        try {
            const text = await fetchCSV(SEARCH_ENGINES_URL, CACHE_KEY_SEARCH_ENGINES, forceRefresh);
            const rows = parseCSV(text);
            const engines = [];
            for (let i = 1; i < rows.length; i++) {
                const parts = rows[i];
                if (parts.length >= 3) {
                    const name = parts[0];
                    let urlTemplate = parts[1];
                    const useIt = (parts[2] || "").toLowerCase();
                    const icon = parts[3] || "";
                    if (urlTemplate && !urlTemplate.includes("%s")) {
                        urlTemplate += urlTemplate.includes("?") ? "&q=%s" : "?q=%s";
                    }
                    const active = (useIt === "yes" || useIt === "y" || useIt === "true");
                    if (name && urlTemplate) engines.push({ name, urlTemplate, active, customIcon: icon });
                }
            }
            if (engines.length === 0) engines.push({ name: "Google", urlTemplate: "https://www.google.com/search?q=%s", active: true, customIcon: "" });
            return engines;
        } catch(e) {
            return [{ name: "Google", urlTemplate: "https://www.google.com/search?q=%s", active: true, customIcon: "" }];
        }
    }

    async function loadFolders(forceRefresh = false) {
        try {
            const text = await fetchCSV(FOLDERS_CSV_URL, CACHE_KEY_FOLDERS, forceRefresh);
            const rows = parseCSV(text);
            const map = new Map();
            for (let i = 1; i < rows.length; i++) {
                const parts = rows[i];
                if (parts.length < 3) continue;
                const name = parts[0], url = parts[1];
                const folderName = parts[2];
                const customIcon = parts[3] || "";
                if (!name || !url || !url.startsWith("http") || !folderName) continue;
                if (!map.has(folderName)) map.set(folderName, { folderName, items: [] });
                map.get(folderName).items.push({ name, url, customIcon });
            }
            return Array.from(map.values());
        } catch(e) { console.error(e); return []; }
    }

    // ==================== RENDER: CATEGORIES ====================
    function renderCategories() {
        const container = dom.categoriesContainer;
        const categories = ["Cat A", "Cat B", "Cat C", "Cat D", "Cat E"];
        const grouped = { "Cat A": [], "Cat B": [], "Cat C": [], "Cat D": [], "Cat E": [] };
        for (const b of csvCategoryBookmarks) {
            if (grouped[b.category]) grouped[b.category].push(b);
        }
        const chunks = [];
        let hasAny = false;
        for (const cat of categories) {
            const items = grouped[cat];
            if (items.length === 0) continue;
            hasAny = true;
            chunks.push(`<div class="category-row"><div class="category-title">${cat}</div><div class="equal-grid">`);
            for (const item of items) {
                const iconUrl = item.customIcon && item.customIcon.startsWith('http') ? item.customIcon : getFaviconUrl(item.url);
                const fallback = getFaviconUrl(item.url);
                const displayName = item.name.length > 14 ? item.name.slice(0,12)+'..' : item.name;
                chunks.push(`<a href="${escapeHtml(item.url)}" target="_blank" class="clean-app-tile">
                    <div class="direct-icon">
                        <img loading="lazy" src="${iconUrl}" width="40" height="40" data-fallback="${fallback}">
                    </div>
                    <span>${escapeHtml(displayName)}</span>
                </a>`);
            }
            chunks.push(`</div></div>`);
        }
        container.innerHTML = hasAny
            ? chunks.join('')
            : '<div class="empty-cat">No categories found. Add bookmarks with Cat A, Cat B, etc.</div>';
    }

    // ==================== RENDER: FOLDERS ====================
    function renderFolders() {
        const bar = dom.foldersBar;
        if (!foldersData.length) {
            bar.innerHTML = "";
            return;
        }
        const chunks = [];
        foldersData.forEach((folder, idx) => {
            const color = getFolderColor(folder.folderName);
            chunks.push(`<div class="folder-btn" data-folder-idx="${idx}" title="${escapeHtml(folder.folderName)}" style="color:${color};">
                <i class="fas fa-folder"></i>
            </div>`);
        });
        bar.innerHTML = chunks.join('');
    }

    function onFolderBarClick(e) {
        const btn = e.target.closest(".folder-btn");
        if (!btn) return;
        e.stopPropagation();
        const idx = parseInt(btn.getAttribute("data-folder-idx"), 10);
        openFolderPopup(idx, btn);
    }

    function openFolderPopup(idx, btn) {
        if (activeFolderPopup && activeFolderBtn === btn) {
            closeFolderPopup();
            return;
        }
        closeFolderPopup();
        const folder = foldersData[idx];
        if (!folder) return;

        const color = getFolderColor(folder.folderName);
        const popup = document.createElement("div");
        popup.className = "folder-popup";

        const chunks = [`<div class="folder-popup-header" style="color:${color};"><i class="fas fa-folder-open" style="color:${color};"></i>${escapeHtml(folder.folderName)}</div>`];
        for (const item of folder.items) {
            const iconUrl = (item.customIcon && item.customIcon.startsWith("http")) ? item.customIcon : getFaviconUrl(item.url);
            const fallback = getFaviconUrl(item.url);
            chunks.push(`<a class="folder-popup-item" href="${escapeHtml(item.url)}" target="_blank">
                <img loading="lazy" src="${escapeHtml(iconUrl)}" data-fallback="${fallback}">
                <span>${escapeHtml(item.name)}</span>
            </a>`);
        }
        popup.innerHTML = chunks.join('');
        document.body.appendChild(popup);

        const rect = btn.getBoundingClientRect();
        const popupWidth = popup.offsetWidth || 240;
        let left = rect.left + rect.width / 2 - popupWidth / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - popupWidth - 8));
        popup.style.position = "fixed";
        popup.style.top = `${rect.bottom + 8}px`;
        popup.style.left = `${left}px`;

        btn.classList.add("active");
        activeFolderPopup = popup;
        activeFolderBtn = btn;
    }

    function closeFolderPopup() {
        if (activeFolderPopup) {
            activeFolderPopup.remove();
            activeFolderPopup = null;
        }
        if (activeFolderBtn) {
            activeFolderBtn.classList.remove("active");
            activeFolderBtn = null;
        }
    }

    // ==================== RENDER: ENGINE DROPDOWN ====================
    function renderEngineDropdown() {
        const dropdown = dom.engineDropdown;
        const chunks = [];
        for (const eng of searchEngines) {
            const iconUrl = eng.customIcon && eng.customIcon.startsWith('http') ? eng.customIcon : getFaviconUrl(eng.urlTemplate);
            const fallback = getFaviconUrl(eng.urlTemplate);
            chunks.push(`<div class="dropdown-item" data-action="engine" data-name="${escapeHtml(eng.name)}">
                <img loading="lazy" src="${iconUrl}" style="width:20px;height:20px;" data-fallback="${fallback}">
                ${escapeHtml(eng.name)}
            </div>`);
        }
        dropdown.innerHTML = chunks.join('');
    }

    function updateEngineIcon() {
        if (currentEngine) {
            const iconUrl = currentEngine.customIcon && currentEngine.customIcon.startsWith('http') ? currentEngine.customIcon : getFaviconUrl(currentEngine.urlTemplate);
            dom.currentEngineIcon.src = iconUrl;
        }
    }

    function toggleDropdown(e) {
        e.stopPropagation();
        const dropdown = dom.engineDropdown;
        if (dropdown.style.display === "block") {
            closeDropdown();
            return;
        }
        const input = dom.engineQueryInput;
        if (input.value.trim()) {
            showSuggestions(input.value);
            return;
        }
        renderEngineDropdown();
        dropdown.style.display = "block";
        isDropdownOpen = true;
    }

    function closeDropdown() {
        dom.engineDropdown.style.display = "none";
        isDropdownOpen = false;
        highlightedSuggestionIdx = -1;
    }

    // ==================== SEARCH SUGGESTIONS ====================
    function collectAllShortcuts() {
        const items = [];
        for (const folder of foldersData) {
            for (const it of folder.items) {
                items.push({ name: it.name, url: it.url, customIcon: it.customIcon, folder: folder.folderName });
            }
        }
        for (const b of csvCategoryBookmarks) {
            items.push({ name: b.name, url: b.url, customIcon: b.customIcon, folder: b.category });
        }
        return items;
    }

    function findSuggestions(query) {
        if (!query || !query.trim()) return [];
        const q = query.toLowerCase().trim();
        const all = collectAllShortcuts();
        const scored = [];
        for (const item of all) {
            const name = (item.name || "").toLowerCase();
            const folder = (item.folder || "").toLowerCase();
            let score = -1;
            if (name.startsWith(q)) score = 0;
            else if (name.includes(q)) score = 1;
            else if (folder.startsWith(q)) score = 2;
            else if (folder.includes(q)) score = 3;
            if (score >= 0) scored.push({ item, score });
        }
        scored.sort((a, b) => a.score - b.score || a.item.name.localeCompare(b.item.name));
        return scored.slice(0, 8).map(s => s.item);
    }

    function showSuggestions(query) {
        const dropdown = dom.engineDropdown;
        const items = findSuggestions(query);
        currentSuggestions = items;
        highlightedSuggestionIdx = -1;

        if (items.length === 0) {
            dropdown.style.display = "none";
            return;
        }

        const chunks = [];
        items.forEach((item, idx) => {
            const iconUrl = (item.customIcon && item.customIcon.startsWith("http")) ? item.customIcon : getFaviconUrl(item.url);
            const fallback = getFaviconUrl(item.url);
            const folderColor = getFolderColor(item.folder);
            chunks.push(`<a class="dropdown-item" data-idx="${idx}" data-action="suggestion" href="${escapeHtml(item.url)}" target="_blank">
                <img loading="lazy" src="${escapeHtml(iconUrl)}" data-fallback="${fallback}">
                <div class="shortcut-info">
                    <div class="shortcut-name">${escapeHtml(item.name)}</div>
                    <div class="shortcut-folder" style="color:${folderColor};"><i class="fas fa-folder"></i>${escapeHtml(item.folder)}</div>
                </div>
            </a>`);
        });
        dropdown.innerHTML = chunks.join('');
        dropdown.style.display = "block";
        isDropdownOpen = true;
    }

    function highlightSuggestion(dir) {
        const items = dom.engineDropdown.querySelectorAll(".dropdown-item");
        if (!items.length) return;
        items.forEach(i => i.classList.remove("highlighted"));
        highlightedSuggestionIdx += dir;
        if (highlightedSuggestionIdx < 0) highlightedSuggestionIdx = items.length - 1;
        if (highlightedSuggestionIdx >= items.length) highlightedSuggestionIdx = 0;
        items[highlightedSuggestionIdx].classList.add("highlighted");
        items[highlightedSuggestionIdx].scrollIntoView({ block: "nearest" });
    }

    function openHighlightedSuggestion() {
        const items = dom.engineDropdown.querySelectorAll(".dropdown-item");
        if (highlightedSuggestionIdx >= 0 && items[highlightedSuggestionIdx]) {
            window.open(items[highlightedSuggestionIdx].getAttribute("href"), "_blank");
            closeDropdown();
            dom.engineQueryInput.value = "";
            return true;
        }
        return false;
    }

    function performSearch() {
        const input = dom.engineQueryInput;
        const query = input.value;
        if (openHighlightedSuggestion()) return;
        if (currentSuggestions && currentSuggestions.length === 1) {
            window.open(currentSuggestions[0].url, "_blank");
            input.value = "";
            closeDropdown();
            return;
        }
        if (!query.trim()) return;
        const engine = currentEngine || searchEngines[0];
        window.open(engine.urlTemplate.replace("%s", encodeURIComponent(query)), "_blank");
        closeDropdown();
    }

    // ==================== CALENDAR ====================
    function showCalendarPopup(anchorBtn) {
        if (activeCalendar) { activeCalendar.remove(); activeCalendar = null; return; }
        const popup = document.createElement('div');
        popup.className = 'calendar-popup';

        function renderCal(year, month) {
            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const chunks = [`<div class="calendar-header"><button class="prevCalBtn"><i class="fas fa-chevron-left"></i></button><span class="calMonthYear">${firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span><button class="nextCalBtn"><i class="fas fa-chevron-right"></i></button></div><div class="calendar-grid">`];
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            for (const d of weekdays) chunks.push(`<div class="calendar-weekday">${d}</div>`);
            for (let i = 0; i < startDay; i++) chunks.push(`<div></div>`);
            const now = new Date();
            for (let d = 1; d <= daysInMonth; d++) {
                const dayOfWeek = (startDay + d - 1) % 7;
                const isFriSat = dayOfWeek === 5 || dayOfWeek === 6;
                const isToday = d === now.getDate() && year === now.getFullYear() && month === now.getMonth();
                let dayClass = '';
                if (isFriSat) dayClass = 'friday-sat';
                if (isToday) dayClass = 'current-day';
                chunks.push(`<div class="calendar-day ${dayClass}">${d}</div>`);
            }
            chunks.push(`</div>`);
            popup.innerHTML = chunks.join('');
            popup.querySelector('.prevCalBtn').onclick = (e) => {
                e.stopPropagation();
                let nm = month - 1, ny = year;
                if (nm < 0) { nm = 11; ny--; }
                renderCal(ny, nm);
            };
            popup.querySelector('.nextCalBtn').onclick = (e) => {
                e.stopPropagation();
                let nm = month + 1, ny = year;
                if (nm > 11) { nm = 0; ny++; }
                renderCal(ny, nm);
            };
        }
        renderCal(new Date().getFullYear(), new Date().getMonth());

        const rect = anchorBtn.getBoundingClientRect();
        popup.style.position = 'fixed';
        popup.style.top = `${rect.bottom + 5}px`;
        popup.style.right = `${window.innerWidth - rect.right + 5}px`;
        document.body.appendChild(popup);
        activeCalendar = popup;
    }

    // Helper: given an end hour (which may exceed 24 for Isha), format it.
    // For display we show the actual clock time of the boundary.
    function fmtBoundary(h) {
        return format12Hour(((h % 24) + 24) % 24);
    }

    function showSalahPopup(anchorBtn) {
        if (activeSalahPopup) {
            closeSalahPopup();
            return;
        }

        const now = new Date();
        const dayKey = now.toDateString();
        if (cachedPrayerDay !== dayKey) {
            cachedTimes = computePrayerTimes(
                new Date(now.getFullYear(), now.getMonth(), now.getDate()),
                PRAYER_LAT, PRAYER_LNG, PRAYER_TIMEZONE
            );
            cachedPrayerDay = dayKey;
        }

        const state = getCurrentSalahState(now, cachedTimes);
        const raw = cachedTimes.raw;

        // Build boundary map for each wakth: startRaw → endRaw (in local decimal hours)
        const boundaries = {
            fajr:    { start: raw.fajr,    end: raw.dhuhr },
            dhuhr:   { start: raw.dhuhr,   end: raw.asr },
            asr:     { start: raw.asr,     end: raw.maghrib },
            maghrib: { start: raw.maghrib, end: raw.isha },
            isha:    { start: raw.isha,    end: raw.fajr + 24 } // Isha ends at next day's Fajr
        };

        const popup = document.createElement("div");
        popup.className = "salah-popup";

        const order = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];

        let chunks = [];
        chunks.push(`<div class="salah-popup-header">
            <i class="fas fa-mosque"></i>
            <span>Prayer Times</span>
            <span class="popup-loc"><i class="fas fa-map-marker-alt"></i>${escapeHtml(LOCATION_NAME)}</span>
        </div>`);
        chunks.push(`<div class="salah-popup-list">`);

        // --- Five wakth rows: name + start → end range ---
        for (const w of order) {
            const meta = WAKTH_META[w];
            const isCurrent = (state.wakth === w && !state.forbidden);
            const rowClass = isCurrent ? 'current' : '';
            const b = boundaries[w];
            const rangeStart = fmtBoundary(b.start);
            const rangeEnd = fmtBoundary(b.end);
            chunks.push(`<div class="salah-popup-row ${rowClass}">
                <div class="salah-popup-icon"><i class="fas ${meta.icon}"></i></div>
                <div class="salah-popup-info">
                    <div class="salah-popup-name">${meta.name}</div>
                    <div class="salah-popup-range">
                        <span>${escapeHtml(rangeStart)}</span>
                        <i class="fas fa-arrow-right"></i>
                        <span>${escapeHtml(rangeEnd)}</span>
                    </div>
                </div>
            </div>`);
        }

        // --- Divider ---
        chunks.push(`<div class="salah-popup-divider"></div>`);

        // --- Forbidden intervals: for each we show the actual short window ---
        // Sunrise: sunrise → sunrise + 20 min
        const sunriseStart = raw.sunrise;
        const sunriseEnd = raw.sunrise + 20/60;
        // Zenith: dhuhr - 10 min → dhuhr
        const zenithStart = raw.dhuhr - 10/60;
        const zenithEnd = raw.dhuhr;
        // Sunset: maghrib - 10 min → maghrib
        const sunsetStart = raw.maghrib - 10/60;
        const sunsetEnd = raw.maghrib;

        const forbiddenRows = [
            { name: 'Sunrise (Forbidden)', sub: 'Shuruq — pause prayer', start: sunriseStart, end: sunriseEnd, icon: 'fa-exclamation-triangle' },
            { name: 'Zenith (Forbidden)',  sub: 'Istiwa — solar noon',   start: zenithStart,  end: zenithEnd,  icon: 'fa-sun' },
            { name: 'Sunset (Forbidden)',  sub: 'Ghurub — pause prayer', start: sunsetStart,  end: sunsetEnd,  icon: 'fa-cloud-moon' }
        ];

        for (const f of forbiddenRows) {
            chunks.push(`<div class="salah-popup-row forbidden-row">
                <div class="salah-popup-icon"><i class="fas ${f.icon}"></i></div>
                <div class="salah-popup-info">
                    <div class="salah-popup-name">${escapeHtml(f.name)}</div>
                    <div class="salah-popup-range">
                        <span>${escapeHtml(fmtBoundary(f.start))}</span>
                        <i class="fas fa-arrow-right"></i>
                        <span>${escapeHtml(fmtBoundary(f.end))}</span>
                    </div>
                </div>
            </div>`);
        }

        chunks.push(`</div>`);

        // --- Footer: method info ---
        chunks.push(`<div class="salah-popup-footer">
            <span class="method-label"><i class="fas fa-calculator"></i>Salafi (Fajr 18°, Isha 17°)</span>
            <span>Asr: Shafi'i</span>
        </div>`);

        popup.innerHTML = chunks.join('');
        document.body.appendChild(popup);

        const rect = anchorBtn.getBoundingClientRect();
        const popupWidth = popup.offsetWidth || 300;
        let left = rect.right - popupWidth;
        left = Math.max(8, Math.min(left, window.innerWidth - popupWidth - 8));
        popup.style.position = "fixed";
        popup.style.top = `${rect.bottom + 8}px`;
        popup.style.left = `${left}px`;

        activeSalahPopup = popup;
    }

    // ==================== WORK HOUR WIDGET ====================
    function updateWorkWidget() {
        const now = new Date();
        const day = now.getDay();
        const isWorkDay = WORK_DAYS.includes(day);
        const currentHours = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;

        const startH = WORK_START_HOUR;
        const endH = WORK_END_HOUR;
        const totalH = endH - startH;

        const widget = dom.workWidget;
        const statusText = dom.workStatusText;
        const statusIcon = dom.workStatusIcon;
        const timerEl = dom.workTimer;
        const fillEl = dom.workProgressFill;
        const tile = dom.workDayTile;
        const tilePct = dom.workTilePct;
        const tileLabel = dom.workTileLabel;

        widget.classList.remove('working', 'off', 'holiday');

        const dateKey = now.toDateString();
        tile.style.background = getDayTileColor(dateKey);

        let progress = 0;
        let inWork = false;
        let displayTime = '--:--';

        if (isWorkDay && currentHours >= startH && currentHours < endH) {
            inWork = true;
            progress = ((currentHours - startH) / totalH) * 100;
        }

        if (isWorkDay) {
            if (inWork) {
                const remainingH = endH - currentHours;
                const rh = Math.floor(remainingH);
                const rm = Math.floor((remainingH - rh) * 60);
                displayTime = `${rh}h ${String(rm).padStart(2,'0')}m left`;
                statusText.textContent = 'Working';
                statusIcon.className = 'fas fa-circle';
                widget.classList.add('working');
            } else if (currentHours < startH) {
                const untilH = startH - currentHours;
                const uh = Math.floor(untilH);
                const um = Math.floor((untilH - uh) * 60);
                displayTime = `${uh}h ${String(um).padStart(2,'0')}m left`;
                statusText.textContent = 'Starts in';
                statusIcon.className = 'fas fa-hourglass-half';
                widget.classList.add('off');
            } else {
                statusText.textContent = 'Day ended';
                statusIcon.className = 'fas fa-check-circle';
                displayTime = 'Done';
                widget.classList.add('off');
                progress = 100;
            }
        } else {
            statusText.textContent = 'Holiday';
            statusIcon.className = 'fas fa-umbrella-beach';
            displayTime = 'Relax';
            widget.classList.add('holiday');
            progress = 0;
        }

        timerEl.textContent = displayTime;
        fillEl.style.width = progress + '%';

        if (isWorkDay) {
            const pct = Math.round(progress);
            tilePct.textContent = pct + '%';
            if (inWork) tileLabel.textContent = 'DAY';
            else if (currentHours < startH) tileLabel.textContent = 'SOON';
            else tileLabel.textContent = 'DONE';
        } else {
            tilePct.textContent = DAY_NAMES_SHORT[day];
            tileLabel.textContent = 'OFF';
        }
    }

    // ==================== PRAYER TIMES (ASTRONOMICAL, SALAFI) ====================
    function computePrayerTimes(date, lat, lng, tz) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let yr = year, mo = month;
        if (mo <= 2) { yr -= 1; mo += 12; }
        const A = Math.floor(yr / 100);
        const B = Math.floor(A / 4);
        const C = 2 - A + B;
        const E = Math.floor(365.25 * (yr + 4716));
        const F = Math.floor(30.6001 * (mo + 1));
        const JD = C + day + E + F - 1524.5;

        const D = JD - 2451545.0;
        const g = (357.529 + 0.98560028 * D) % 360;
        const q = (280.459 + 0.98564736 * D) % 360;
        const L = (q + 1.915 * Math.sin(g * Math.PI/180) + 0.020 * Math.sin(2 * g * Math.PI/180)) % 360;
        const e = 23.439 - 0.00000036 * D;
        const RA = Math.atan2(Math.cos(e * Math.PI/180) * Math.sin(L * Math.PI/180), Math.cos(L * Math.PI/180)) * 180/Math.PI / 15;
        const eqt = q/15 - ((RA + 24) % 24);
        const decl = Math.asin(Math.sin(e * Math.PI/180) * Math.sin(L * Math.PI/180)) * 180/Math.PI;

        const noonUTC = 12 - lng/15 - eqt;
        const latRad = lat * Math.PI/180;
        const declRad = decl * Math.PI/180;

        const cosHA = (Math.sin(-0.8333 * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const HA = Math.acos(Math.min(1, Math.max(-1, cosHA))) * 180/Math.PI / 15;
        const sunriseUTC = noonUTC - HA;
        const sunsetUTC = noonUTC + HA;

        const cosFajr = (Math.sin(-18 * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const fajrHA = Math.acos(Math.min(1, Math.max(-1, cosFajr))) * 180/Math.PI / 15;
        const fajrUTC = noonUTC - fajrHA;

        const cosIsha = (Math.sin(-17 * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const ishaHA = Math.acos(Math.min(1, Math.max(-1, cosIsha))) * 180/Math.PI / 15;
        const ishaUTC = noonUTC + ishaHA;

        const asrAngle = Math.atan(1 / (1 + Math.tan(Math.abs(latRad - declRad)))) * 180/Math.PI;
        const cosAsr = (Math.sin(asrAngle * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const asrHA = Math.acos(Math.min(1, Math.max(-1, cosAsr))) * 180/Math.PI / 15;
        const asrUTC = noonUTC + asrHA;

        const toLocal = (utcHours) => {
            let h = utcHours + tz;
            h = ((h % 24) + 24) % 24;
            return h;
        };

        return {
            fajr: format12Hour(toLocal(fajrUTC)),
            sunrise: format12Hour(toLocal(sunriseUTC)),
            dhuhr: format12Hour(toLocal(noonUTC + 0.5/60)),
            asr: format12Hour(toLocal(asrUTC)),
            maghrib: format12Hour(toLocal(sunsetUTC + 1/60)),
            isha: format12Hour(toLocal(ishaUTC)),
            raw: {
                fajr: toLocal(fajrUTC),
                sunrise: toLocal(sunriseUTC),
                dhuhr: toLocal(noonUTC),
                asr: toLocal(asrUTC),
                maghrib: toLocal(sunsetUTC),
                isha: toLocal(ishaUTC)
            }
        };
    }

    function getCurrentSalahState(now, times) {
        const raw = times.raw;
        const h = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;

        let wakth, startRaw, endRaw;
        if (h >= raw.fajr && h < raw.dhuhr) {
            wakth = 'fajr'; startRaw = raw.fajr; endRaw = raw.dhuhr;
        } else if (h >= raw.dhuhr && h < raw.asr) {
            wakth = 'dhuhr'; startRaw = raw.dhuhr; endRaw = raw.asr;
        } else if (h >= raw.asr && h < raw.maghrib) {
            wakth = 'asr'; startRaw = raw.asr; endRaw = raw.maghrib;
        } else if (h >= raw.maghrib && h < raw.isha) {
            wakth = 'maghrib'; startRaw = raw.maghrib; endRaw = raw.isha;
        } else {
            wakth = 'isha'; startRaw = raw.isha; endRaw = raw.fajr + 24;
            if (h < raw.fajr) {
                return {
                    wakth: 'isha',
                    startRaw: raw.isha,
                    endRaw: raw.fajr + 24,
                    current: h + 24,
                    forbidden: false,
                    forbiddenReason: null
                };
            }
        }

        let forbidden = false, forbiddenReason = null;
        if (h >= raw.sunrise && h < (raw.sunrise + 20/60)) {
            forbidden = true; forbiddenReason = 'sunrise';
        }
        else if (h >= (raw.dhuhr - 10/60) && h < raw.dhuhr) {
            forbidden = true; forbiddenReason = 'zenith';
        }
        else if (h >= (raw.maghrib - 10/60) && h < raw.maghrib) {
            forbidden = true; forbiddenReason = 'sunset';
        }

        return { wakth, startRaw, endRaw, current: h, forbidden, forbiddenReason };
    }

    function updateSalahWidget() {
        const now = new Date();
        const dayKey = now.toDateString();

        if (cachedPrayerDay !== dayKey) {
            cachedTimes = computePrayerTimes(
                new Date(now.getFullYear(), now.getMonth(), now.getDate()),
                PRAYER_LAT, PRAYER_LNG, PRAYER_TIMEZONE
            );
            cachedPrayerDay = dayKey;
        }

        const state = getCurrentSalahState(now, cachedTimes);
        const meta = WAKTH_META[state.wakth];

        let progress = ((state.current - state.startRaw) / (state.endRaw - state.startRaw)) * 100;
        progress = Math.max(0, Math.min(100, progress));

        const remainingH = state.endRaw - state.current;
        const rh = Math.floor(remainingH);
        const rm = Math.floor((remainingH - rh) * 60);
        const countdownText = `${rh}h ${String(rm).padStart(2,'0')}m left`;

        let mode;
        if (state.forbidden) {
            mode = 'forbidden';
        } else if (remainingH <= 15/60) {
            mode = 'warning';
        } else {
            mode = 'active';
        }

        const stateKey = `${state.wakth}|${mode}|${Math.floor(progress)}|${rh}|${rm}`;
        if (lastSalahState === stateKey) return;
        lastSalahState = stateKey;

        const widget = dom.salahWidget;
        widget.classList.remove('active', 'warning', 'forbidden');
        widget.classList.add(mode);

        const iconTile = dom.salahIconTile;
        iconTile.classList.remove('active', 'warning', 'forbidden');
        iconTile.classList.add(mode);

        const nameEl = dom.salahName;
        nameEl.classList.remove('active', 'warning', 'forbidden');
        nameEl.classList.add(mode);

        let iconClass;
        if (state.forbidden) {
            iconClass = 'fa-exclamation-triangle';
        } else if (mode === 'warning') {
            iconClass = 'fa-hourglass-end';
        } else {
            iconClass = meta.icon;
        }
        dom.salahIcon.className = `fas ${iconClass}`;

        if (state.forbidden) {
            const reasonMap = {
                sunrise: 'Sunrise',
                zenith: 'Zenith',
                sunset: 'Sunset'
            };
            dom.salahNameText.textContent = reasonMap[state.forbiddenReason] || 'Forbidden';
            nameEl.querySelector('i').className = 'fas fa-ban';
        } else {
            dom.salahNameText.textContent = meta.name;
            nameEl.querySelector('i').className = `fas ${meta.icon}`;
        }

        dom.salahCountdown.textContent = countdownText;
        dom.salahProgressFill.style.width = progress + '%';
        dom.salahStartTime.textContent = format12Hour(state.startRaw);
        dom.salahEndTime.textContent = format12Hour(state.endRaw % 24);
    }

                closeFolderPopup();
            }
            if (dom.searchContainer && !dom.searchContainer.contains(e.target)) {
                closeDropdown();
            }
            if (activeCalendar && !activeCalendar.contains(e.target) && e.target !== dom.calendarBtn && !dom.calendarBtn.contains(e.target)) {
                activeCalendar.remove();
                activeCalendar = null;
            }
            if (activeSalahPopup && !activeSalahPopup.contains(e.target) && e.target !== dom.salahWidget && !dom.salahWidget.contains(e.target)) {
                closeSalahPopup();
            }
        });

        document.addEventListener("error", (e) => {
            const t = e.target;
            if (t.tagName === "IMG" && t.dataset.fallback) {
                if (t.src !== t.dataset.fallback) t.src = t.dataset.fallback;
            }
        }, true);

        const profileImg = dom.profileImage;
        profileImg.addEventListener("error", () => {
            profileImg.style.display = 'none';
            dom.fallbackIcon.style.display = 'flex';
        }, { once: true });

        dom.engineDropdown.addEventListener("click", (e) => {
            const item = e.target.closest(".dropdown-item");
            if (!item) return;
            const action = item.dataset.action;
            if (action === "engine") {
                e.stopPropagation();
                const name = item.dataset.name;
                const eng = searchEngines.find(x => x.name === name);
                if (eng) {
                    for (const se of searchEngines) se.active = false;
                    eng.active = true;
                    currentEngine = eng;
                    updateEngineIcon();
                    closeDropdown();
                }
            } else if (action === "suggestion") {
                setTimeout(() => {
                    closeDropdown();
                    dom.engineQueryInput.value = "";
                }, 10);
            }
        });

        dom.calendarBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            showCalendarPopup(dom.calendarBtn);
        });

        dom.editSheetBtn.addEventListener("click", () => {
            window.open(EDIT_SHEET_URL, "_blank");
        });

        dom.refreshCsvBtn.addEventListener("click", refreshAll);
        dom.engineSearchBtn.addEventListener("click", performSearch);
        dom.engineSelectorBtn.addEventListener("click", toggleDropdown);

        dom.salahWidget.addEventListener("click", (e) => {
            e.stopPropagation();
            showSalahPopup(dom.salahWidget);
        });

        const input = dom.engineQueryInput;
        let inputDebounce;
        input.addEventListener("input", (e) => {
            const val = e.target.value;
            clearTimeout(inputDebounce);
            inputDebounce = setTimeout(() => {
                if (val.trim()) showSuggestions(val);
                else closeDropdown();
            }, 120);
        });
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                performSearch();
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                highlightSuggestion(1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                highlightSuggestion(-1);
            } else if (e.key === "Escape") {
                closeDropdown();
            }
        });
        input.addEventListener("focus", (e) => {
            if (e.target.value.trim()) showSuggestions(e.target.value);
        });
    }

    // ==================== INIT ====================
    async function init() {
        dom.profileImage = document.getElementById("profileImage");
        dom.fallbackIcon = document.getElementById("fallbackIcon");
        dom.categoriesContainer = document.getElementById("categoriesContainer");
        dom.foldersBar = document.getElementById("foldersBar");
        dom.searchContainer = document.getElementById("searchContainer");
        dom.engineDropdown = document.getElementById("engineDropdown");
        dom.engineQueryInput = document.getElementById("engineQueryInput");
        dom.engineSearchBtn = document.getElementById("engineSearchBtn");
        dom.engineSelectorBtn = document.getElementById("engineSelectorBtn");
        dom.currentEngineIcon = document.getElementById("currentEngineIcon");
        dom.calendarBtn = document.getElementById("calendarBtn");
        dom.editSheetBtn = document.getElementById("editSheetBtn");
        dom.refreshCsvBtn = document.getElementById("refreshCsvBtn");
        dom.clockDisplay = document.getElementById("clockDisplay");
        dom.dateDisplay = document.getElementById("dateDisplay");
        dom.cacheIndicator = document.getElementById("cacheIndicator");
        dom.workWidget = document.getElementById("workWidget");
        dom.workStatusText = document.getElementById("workStatusText");
        dom.workStatusIcon = document.getElementById("workStatusIcon");
        dom.workTimer = document.getElementById("workTimer");
        dom.workProgressFill = document.getElementById("workProgressFill");
        dom.workDayTile = document.getElementById("workDayTile");
        dom.workTilePct = document.getElementById("workTilePct");
        dom.workTileLabel = document.getElementById("workTileLabel");
        dom.salahWidget = document.getElementById("salahWidget");
        dom.salahIconTile = document.getElementById("salahIconTile");
        dom.salahIcon = document.getElementById("salahIcon");
        dom.salahName = document.getElementById("salahName");
        dom.salahNameText = document.getElementById("salahNameText");
        dom.salahCountdown = document.getElementById("salahCountdown");
        dom.salahProgressFill = document.getElementById("salahProgressFill");
        dom.salahStartTime = document.getElementById("salahStartTime");
        dom.salahEndTime = document.getElementById("salahEndTime");

        setupEventListeners();

        setInterval(updateClock, 1000);
        setInterval(updateSalahWidget, 30000);
        setInterval(updateWorkWidget, 30000);
        updateClock();
        updateSalahWidget();
        updateWorkWidget();

        try {
            dom.cacheIndicator.innerHTML = '📦 Loading...';
            const [categories, engines, folders] = await Promise.all([
                loadCsvCategoryBookmarks(false),
                loadSearchEngines(false),
                loadFolders(false)
            ]);
            csvCategoryBookmarks = categories;
            searchEngines = engines;
            foldersData = folders;

            if (!searchEngines.some(e => e.active)) searchEngines[0].active = true;
            currentEngine = searchEngines.find(e => e.active);
            updateEngineIcon();

            renderCategories();
            renderEngineDropdown();
            renderFolders();

            dom.cacheIndicator.innerHTML = `✅ Ready (${csvCategoryBookmarks.length} items, ${foldersData.length} folders)`;
            setTimeout(() => {
                if (dom.cacheIndicator.innerHTML.includes('Ready')) dom.cacheIndicator.innerHTML = `📚 Cached`;
            }, 2000);
        } catch(err) {
            console.error(err);
            dom.categoriesContainer.innerHTML = `<div class="empty-cat">Error: ${escapeHtml(err.message)}</div>`;
            dom.cacheIndicator.innerHTML = `⚠️ Error`;
        }

        const profileImg = dom.profileImage;
        if (profileImg.complete && profileImg.naturalHeight === 0) {
            profileImg.style.display = 'none';
            dom.fallbackIcon.style.display = 'flex';
        }
    }

    init();
</script>
</body>

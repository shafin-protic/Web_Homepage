<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shafin's Space</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000' rx='24'/%3E%3Cpath fill='%233b82f6' d='M30 30h40a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V34a4 4 0 0 1 4-4zm5 12v20h30V42H35z'/%3E%3Ccircle cx='68' cy='36' r='3.5' fill='%23facc15'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }
        .hide-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem 1.5rem;
            gap: 1rem;
            overflow: hidden;
        }
        
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .title-section {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            border: 2px solid #3b82f6;
        }
        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #87CEEB, #ffffff, #87CEEB, #add8e6, #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: skyTitleShine 3s ease-in-out infinite;
            letter-spacing: 1px;
        }
        @keyframes skyTitleShine {
            0% { background-position: 0% center; opacity: 0.85; }
            50% { background-position: 100% center; opacity: 1; }
            100% { background-position: 0% center; opacity: 0.85; }
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            position: relative;
        }

        /* === SALAH TIMER (top bar) === */
        .salah-timer {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 2.5rem;
            padding: 0.2rem 0.4rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .salah-timer .wakth-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.05rem;
            padding: 0.15rem 0.45rem;
            border-radius: 1.5rem;
            background: #141414;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            min-width: 52px;
            line-height: 1.1;
        }
        .salah-timer .wakth-badge.active {
            background: #1e3a8a;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.45);
        }
        .salah-timer .wakth-badge.forbidden {
            background: #2a0a0a;
            color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.25);
        }
        .salah-timer .wakth-badge.forbidden .time,
        .salah-timer .wakth-badge.forbidden .label,
        .salah-timer .wakth-badge.forbidden i {
            color: #ef4444;
        }
        .salah-timer .wakth-badge .time {
            font-family: monospace;
            font-size: 0.68rem;
            font-weight: 600;
            color: #d1d5db;
        }
        .salah-timer .wakth-badge.active .time {
            color: #bfdbfe;
        }
        .salah-timer .wakth-badge .label {
            font-size: 0.5rem;
            font-weight: 500;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 0.15rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .salah-timer .wakth-badge .label i {
            font-size: 0.5rem;
        }
        .salah-timer .wakth-badge.active .label {
            color: #bfdbfe;
        }
        .salah-timer .separator {
            color: #2a2a2a;
            font-size: 0.6rem;
            user-select: none;
        }
        .location-label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0 0.45rem;
            font-size: 0.58rem;
            font-weight: 500;
            color: #6b7280;
            border-left: 1px solid #1e1e1e;
            margin-left: 0.1rem;
        }
        .location-label i {
            color: #3b82f6;
            font-size: 0.6rem;
        }
        .location-label span {
            letter-spacing: 0.3px;
        }

        .clock-date { text-align: right; }
        .clock { font-size: 1.2rem; font-weight: 600; font-family: monospace; }
        .date { font-size: 0.65rem; color: #9ca3af; }
        .icon-btn {
            background: #1f2937;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: #374151; transform: scale(1.05); }
        
        .calendar-popup {
            position: fixed;
            background: #111;
            border: 1px solid #333;
            border-radius: 1rem;
            padding: 1rem;
            width: 320px;
            z-index: 10001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .calendar-header button {
            background: #1f2937;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
        }
        .calendar-header button:hover { background: #374151; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 0.3rem;
        }
        .calendar-weekday { font-size: 0.7rem; color: #9ca3af; padding: 0.3rem; }
        .calendar-day {
            padding: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 0.5rem;
            position: relative;
        }
        .calendar-day:hover { background: #1f2937; }
        .friday-sat { color: #ef4444; }
        .current-day { background: #3b82f6; color: white; }
        
        /* Centered web search bar with folder icons beside */
        .search-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            padding: 0.5rem 0;
            gap: 0.6rem;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .folders-bar {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-shrink: 0;
        }
        .folder-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            position: relative;
        }
        .folder-btn:hover {
            transform: translateY(-2px);
            background: #1a1a1a;
            border-color: #3b82f6;
        }
        .folder-btn.active {
            border-color: #3b82f6;
            background: #111a2e;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.35);
        }
        .folder-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px;
        }
        .folder-btn i {
            font-size: 1rem;
            color: #3b82f6;
        }
        .folder-popup {
            position: fixed;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 1rem;
            padding: 0.7rem;
            min-width: 220px;
            max-width: 320px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 10002;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            scrollbar-width: none;
        }
        .folder-popup::-webkit-scrollbar { display: none; }
        .folder-popup-header {
            font-size: 0.7rem;
            font-weight: 600;
            color: #9ca3af;
            padding: 0.2rem 0.5rem 0.5rem;
            border-bottom: 1px solid #1e1e1e;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .folder-popup-header i {
            color: #3b82f6;
        }
        .folder-popup-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.6rem;
            border-radius: 0.6rem;
            text-decoration: none;
            color: #e5e7eb;
            font-size: 0.75rem;
            font-weight: 500;
            transition: background 0.12s;
        }
        .folder-popup-item:hover {
            background: #1f2937;
        }
        .folder-popup-item img {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
            object-fit: contain;
        }
        .folder-popup-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-container {
            display: flex;
            align-items: center;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 2.5rem;
            padding: 0.3rem 0.5rem;
            transition: all 0.2s;
            flex: 1;
            max-width: 720px;
            position: relative;
        }
        .search-container:focus-within {
            border-color: #3b82f6;
            background: #050505;
        }
        .engine-icon-display {
            background: transparent;
            border: none;
            margin-left: 0.3rem;
            margin-right: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 2rem;
            transition: 0.2s;
            position: relative;
            z-index: 5;
        }
        .engine-icon-display:hover {
            background: #1f2937;
        }
        .engine-icon-display img {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            pointer-events: none;
        }
        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 0.6rem 0.8rem;
            outline: none;
            min-width: 0;
        }
        .search-container input::placeholder { color: #4b5563; }
        .search-container button {
            background: #0d9488;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .search-container button:hover { background: #0f766e; }
        
        .dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 1rem;
            z-index: 1000;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            text-decoration: none;
            color: #e5e7eb;
            transition: 0.1s;
        }
        .dropdown-item:hover { background: #1f2937; }
        .dropdown-item img { width: 20px; height: 20px; border-radius: 4px; }

        .categories-section {
            flex: 1;
            overflow-y: auto;
        }
        .category-row { margin-bottom: 1.5rem; }
        .category-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 0.6rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.7rem;
        }
        .equal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 0.8rem;
            width: 100%;
        }
        .clean-app-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.15s;
            background: transparent;
            padding: 0.3rem;
        }
        .clean-app-tile:hover { transform: translateY(-3px); }
        .direct-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.3rem;
        }
        .direct-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .clean-app-tile span {
            font-size: 0.6rem;
            font-weight: 500;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #bbbbbb;
        }
        .empty-cat { color: #4b5563; font-size: 0.85rem; padding: 1rem; text-align: center; }
        .cache-indicator {
            position: fixed;
            bottom: 8px;
            right: 8px;
            font-size: 0.6rem;
            color: #4b5563;
            background: #0a0a0a;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 999;
        }

        @media (max-width: 1100px) {
            .salah-timer .wakth-badge { min-width: 44px; padding: 0.12rem 0.3rem; }
            .salah-timer .wakth-badge .time { font-size: 0.6rem; }
            .salah-timer .wakth-badge .label { font-size: 0.42rem; }
            .salah-timer .wakth-badge .label i { font-size: 0.42rem; }
            .location-label { font-size: 0.5rem; padding: 0 0.3rem; }
        }
        @media (max-width: 900px) {
            .salah-timer .wakth-badge .label span { display: none; }
            .salah-timer .wakth-badge .label i { font-size: 0.55rem; }
            .salah-timer .wakth-badge { min-width: 38px; padding: 0.1rem 0.25rem; }
            .location-label span { display: none; }
            .location-label { padding: 0 0.25rem; }
            .folder-btn { width: 34px; height: 34px; }
            .folder-btn img { width: 18px; height: 18px; }
        }
        @media (max-width: 768px) {
            .app { padding: 0.8rem 1rem; gap: 0.8rem; }
            .page-title h1 { font-size: 1.2rem; }
            .profile-img { width: 32px; height: 32px; }
            .clock { font-size: 0.9rem; }
            .date { font-size: 0.5rem; }
            .header-right { gap: 0.4rem; }
            .icon-btn { width: 28px; height: 28px; font-size: 0.7rem; }
            .search-wrapper { display: none; }
            .categories-section { padding-top: 0.5rem; }
            .category-title { font-size: 0.75rem; }
            .clean-app-tile { padding: 0.2rem; }
            .direct-icon { width: 32px; height: 32px; }
            .clean-app-tile span { font-size: 0.5rem; }
            .equal-grid { gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(55px, 1fr)); }
            .salah-timer { padding: 0.15rem 0.25rem; gap: 0.15rem; }
            .salah-timer .wakth-badge { min-width: 32px; padding: 0.08rem 0.2rem; }
            .salah-timer .wakth-badge .time { font-size: 0.52rem; }
            .salah-timer .wakth-badge .label i { font-size: 0.45rem; }
            .salah-timer .separator { display: none; }
            .location-label { display: none; }
        }
        @media (max-width: 480px) {
            .app { padding: 0.5rem 0.6rem; gap: 0.5rem; }
            .page-title h1 { font-size: 1rem; }
            .profile-img { width: 28px; height: 28px; }
            .clock { font-size: 0.7rem; }
            .date { font-size: 0.45rem; }
            .icon-btn { width: 24px; height: 24px; font-size: 0.6rem; }
            .equal-grid { grid-template-columns: repeat(auto-fit, minmax(45px, 1fr)); gap: 0.3rem; }
            .direct-icon { width: 28px; height: 28px; }
            .clean-app-tile span { font-size: 0.45rem; }
            .salah-timer { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header-row">
        <div class="title-section">
            <img class="profile-img" id="profileImage" src="https://i.postimg.cc/yYbyhL4w/Rounded-Profile.png" alt="Profile" onerror="this.onerror=null; this.style.display='none'; document.getElementById('fallbackIcon').style.display='flex';">
            <div id="fallbackIcon" style="display: none; width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; align-items: center; justify-content: center;">
                <i class="fas fa-user" style="color: white; font-size: 1.2rem;"></i>
            </div>
            <div class="page-title"><h1>Shafin's Space</h1></div>
        </div>
        <div class="header-right">
            <!-- === SALAH TIMER (5 wakth) === -->
            <div class="salah-timer" id="salahTimer" title="Daily prayer times (Salafi method) — Patuakhali, Bangladesh">
                <div class="wakth-badge" data-wakth="fajr">
                    <span class="time" id="timeFajr">--:--</span>
                    <span class="label"><i class="fas fa-moon"></i><span>Fajr</span></span>
                </div>
                <span class="separator">·</span>
                <div class="wakth-badge" data-wakth="dhuhr">
                    <span class="time" id="timeDhuhr">--:--</span>
                    <span class="label"><i class="fas fa-sun"></i><span>Dhuhr</span></span>
                </div>
                <span class="separator">·</span>
                <div class="wakth-badge" data-wakth="asr">
                    <span class="time" id="timeAsr">--:--</span>
                    <span class="label"><i class="fas fa-cloud-sun"></i><span>Asr</span></span>
                </div>
                <span class="separator">·</span>
                <div class="wakth-badge" data-wakth="maghrib">
                    <span class="time" id="timeMaghrib">--:--</span>
                    <span class="label"><i class="fas fa-sunset"></i><span>Maghrib</span></span>
                </div>
                <span class="separator">·</span>
                <div class="wakth-badge" data-wakth="isha">
                    <span class="time" id="timeIsha">--:--</span>
                    <span class="label"><i class="fas fa-star"></i><span>Isha</span></span>
                </div>
                <div class="location-label" id="locationLabel">
                    <i class="fas fa-map-marker-alt"></i><span>Patuakhali</span>
                </div>
            </div>
            <!-- === END SALAH TIMER === -->
            <button class="icon-btn" id="editSheetBtn" title="Edit Google Sheet"><i class="fas fa-pen"></i></button>
            <button class="icon-btn" id="refreshCsvBtn" title="Refresh All Data"><i class="fas fa-sync-alt"></i></button>
            <button class="icon-btn" id="calendarBtn" title="Calendar"><i class="fas fa-calendar-alt"></i></button>
            <div class="clock-date">
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="date" id="dateDisplay">Loading...</div>
            </div>
        </div>
    </div>
    
    <!-- Centered Web Search Bar with Folders beside -->
    <div class="search-wrapper">
        <div class="folders-bar" id="foldersBar"></div>
        <div class="search-container" id="searchContainer">
            <button class="engine-icon-display" id="engineSelectorBtn" aria-label="Select search engine">
                <img id="currentEngineIcon" src="https://www.google.com/s2/favicons?domain=google.com" alt="Search engine">
            </button>
            <input type="text" id="engineQueryInput" placeholder="Search the web...">
            <button id="engineSearchBtn"><i class="fas fa-search"></i></button>
            <div id="engineDropdown" class="dropdown"></div>
        </div>
    </div>

    <div class="categories-section hide-scrollbar" id="categoriesContainer">
        <div class="empty-cat">Loading categories...</div>
    </div>
    <div class="cache-indicator" id="cacheIndicator">Starting...</div>
</div>

<script>
    // ==================== CONFIGURATION ====================
    const CSV_BOOKMARKS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=26452786&single=true&output=csv";
    const SEARCH_ENGINES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=1271015321&single=true&output=csv";
    const FOLDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=1505176942&single=true&output=csv";
    const EDIT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1ErgYkvSzc1CtNPGYAjMV4TeQqMH6tEV-l7DPT6faBPQ/edit?usp=sharing";
    
    const CACHE_KEY_CATEGORIES = 'shafin_categories_v3';
    const CACHE_KEY_SEARCH_ENGINES = 'shafin_search_engines_v3';
    const CACHE_KEY_FOLDERS = 'shafin_folders_v1';
    const CACHE_DURATION = 24 * 60 * 60 * 1000;

    // === SALAH TIMER CONFIG (Astronomical, Salafi) ===
    const PRAYER_LAT = 22.35425;
    const PRAYER_LNG = 90.34141;
    const PRAYER_TIMEZONE = 6;
    const LOCATION_NAME = "Patuakhali";

    // ==================== UTILITY ====================
    function escapeHtml(str) { 
        if (!str) return '';
        return str.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    
    function getFaviconUrl(url) {
        try { const domain = new URL(url).hostname; return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`; } catch(e) { return ""; }
    }
    
    async function fetchCSV(url, cacheKey, forceRefresh = false) {
        if (!forceRefresh) {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) {
                        return data;
                    }
                } catch(e) {}
            }
        }
        const res = await fetch(url);
        const text = await res.text();
        localStorage.setItem(cacheKey, JSON.stringify({ data: text, timestamp: Date.now() }));
        return text;
    }

    // Generic CSV row parser (handles quoted fields)
    function parseCSV(text) {
        const rows = [];
        const lines = text.split(/\r?\n/);
        for (const line of lines) {
            if (!line.trim()) continue;
            const parts = [];
            let inQuote = false;
            let current = '';
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    if (inQuote && line[i+1] === '"') { current += '"'; i++; }
                    else inQuote = !inQuote;
                }
                else if (c === ',' && !inQuote) { parts.push(current); current = ''; }
                else { current += c; }
            }
            parts.push(current);
            rows.push(parts.map(p => p.trim()));
        }
        return rows;
    }
    
    async function loadCsvCategoryBookmarks(forceRefresh = false) {
        try {
            const text = await fetchCSV(CSV_BOOKMARKS_URL, CACHE_KEY_CATEGORIES, forceRefresh);
            const rows = parseCSV(text);
            const data = [];
            for (let i = 1; i < rows.length; i++) {
                const parts = rows[i];
                if (parts.length >= 3) {
                    const name = parts[0];
                    const url = parts[1];
                    const category = parts[2] || "Uncategorized";
                    const customIcon = parts[3] || "";
                    if (name && url && url.startsWith("http")) {
                        data.push({ name, url, category: category.trim(), customIcon });
                    }
                }
            }
            return data;
        } catch(e) { console.error(e); return []; }
    }
    
    async function loadSearchEngines(forceRefresh = false) {
        try {
            const text = await fetchCSV(SEARCH_ENGINES_URL, CACHE_KEY_SEARCH_ENGINES, forceRefresh);
            const rows = parseCSV(text);
            const engines = [];
            for (let i = 1; i < rows.length; i++) {
                const parts = rows[i];
                if (parts.length >= 3) {
                    const name = parts[0];
                    let urlTemplate = parts[1];
                    const useIt = (parts[2] || "").toLowerCase();
                    const icon = parts[3] || "";
                    if (urlTemplate && !urlTemplate.includes("%s")) {
                        urlTemplate += urlTemplate.includes("?") ? "&q=%s" : "?q=%s";
                    }
                    const active = (useIt === "yes" || useIt === "y" || useIt === "true");
                    if (name && urlTemplate) engines.push({ name, urlTemplate, active, customIcon: icon });
                }
            }
            if (engines.length === 0) engines.push({ name: "Google", urlTemplate: "https://www.google.com/search?q=%s", active: true, customIcon: "" });
            return engines;
        } catch(e) { return [{ name: "Google", urlTemplate: "https://www.google.com/search?q=%s", active: true, customIcon: "" }]; }
    }

    // === FOLDERS LOADING ===
    let foldersData = []; // [{ folderName, icon, items: [{ name, url, customIcon }] }]

    async function loadFolders(forceRefresh = false) {
        try {
            const text = await fetchCSV(FOLDERS_CSV_URL, CACHE_KEY_FOLDERS, forceRefresh);
            const rows = parseCSV(text);
            const map = new Map();
            for (let i = 1; i < rows.length; i++) {
                const parts = rows[i];
                if (parts.length < 3) continue;
                const name = parts[0];
                const url = parts[1];
                const folderName = parts[2];
                const customIcon = parts[3] || "";
                if (!name || !url || !url.startsWith("http") || !folderName) continue;

                if (!map.has(folderName)) {
                    map.set(folderName, { folderName, icon: "", items: [] });
                }
                const folder = map.get(folderName);
                // If folder icon is empty and this row has a custom icon, use it for the folder
                if (!folder.icon && customIcon && customIcon.startsWith("http")) {
                    folder.icon = customIcon;
                }
                folder.items.push({ name, url, customIcon });
            }
            return Array.from(map.values());
        } catch(e) { console.error(e); return []; }
    }

    function renderFolders() {
        const bar = document.getElementById("foldersBar");
        if (!foldersData.length) {
            bar.innerHTML = "";
            return;
        }
        let html = "";
        foldersData.forEach((folder, idx) => {
            // Use folder icon if provided; else try first item's icon; else default folder icon
            let iconUrl = folder.icon;
            if (!iconUrl && folder.items.length > 0) {
                const first = folder.items[0];
                if (first.customIcon && first.customIcon.startsWith("http")) iconUrl = first.customIcon;
            }
            const iconHtml = iconUrl
                ? `<img src="${escapeHtml(iconUrl)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><i class="fas fa-folder" style="display:none;"></i>`
                : `<i class="fas fa-folder"></i>`;
            html += `<div class="folder-btn" data-folder-idx="${idx}" title="${escapeHtml(folder.folderName)}">${iconHtml}</div>`;
        });
        bar.innerHTML = html;

        bar.querySelectorAll(".folder-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute("data-folder-idx"), 10);
                openFolderPopup(idx, btn);
            });
        });
    }

    let activeFolderPopup = null;
    let activeFolderBtn = null;

    function openFolderPopup(idx, btn) {
        // If same button clicked, toggle off
        if (activeFolderPopup && activeFolderBtn === btn) {
            closeFolderPopup();
            return;
        }
        closeFolderPopup();
        const folder = foldersData[idx];
        if (!folder) return;

        const popup = document.createElement("div");
        popup.className = "folder-popup";
        let html = `<div class="folder-popup-header"><i class="fas fa-folder-open"></i>${escapeHtml(folder.folderName)}</div>`;
        folder.items.forEach(item => {
            let iconUrl = (item.customIcon && item.customIcon.startsWith("http")) ? item.customIcon : getFaviconUrl(item.url);
            html += `<a class="folder-popup-item" href="${escapeHtml(item.url)}" target="_blank">
                        <img src="${escapeHtml(iconUrl)}" onerror="this.src='${getFaviconUrl(item.url)}';">
                        <span>${escapeHtml(item.name)}</span>
                     </a>`;
        });
        popup.innerHTML = html;
        document.body.appendChild(popup);

        // Position below the folder button
        const rect = btn.getBoundingClientRect();
        const popupWidth = popup.offsetWidth || 240;
        let left = rect.left + rect.width / 2 - popupWidth / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - popupWidth - 8));
        popup.style.position = "fixed";
        popup.style.top = `${rect.bottom + 8}px`;
        popup.style.left = `${left}px`;

        btn.classList.add("active");
        activeFolderPopup = popup;
        activeFolderBtn = btn;

        // Close on outside click
        setTimeout(() => {
            document.addEventListener("click", folderOutsideHandler);
        }, 50);
    }

    function folderOutsideHandler(e) {
        if (activeFolderPopup && !activeFolderPopup.contains(e.target) && e.target !== activeFolderBtn && !activeFolderBtn.contains(e.target)) {
            closeFolderPopup();
        }
    }

    function closeFolderPopup() {
        if (activeFolderPopup) {
            activeFolderPopup.remove();
            activeFolderPopup = null;
        }
        if (activeFolderBtn) {
            activeFolderBtn.classList.remove("active");
            activeFolderBtn = null;
        }
        document.removeEventListener("click", folderOutsideHandler);
    }

    let activeCalendar = null;
    function showCalendarPopup(anchorBtn) {
        if (activeCalendar) { activeCalendar.remove(); activeCalendar = null; return; }
        const popup = document.createElement('div');
        popup.className = 'calendar-popup';
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        
        function renderCal(year, month) {
            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let html = `<div class="calendar-header"><button class="prevCalBtn"><i class="fas fa-chevron-left"></i></button><span class="calMonthYear">${firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span><button class="nextCalBtn"><i class="fas fa-chevron-right"></i></button></div><div class="calendar-grid">`;
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            weekdays.forEach(d => html += `<div class="calendar-weekday">${d}</div>`);
            for (let i = 0; i < startDay; i++) html += `<div></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dayOfWeek = (startDay + d - 1) % 7;
                const isFriSat = dayOfWeek === 5 || dayOfWeek === 6;
                const isToday = d === new Date().getDate() && year === new Date().getFullYear() && month === new Date().getMonth();
                let dayClass = '';
                if (isFriSat) dayClass = 'friday-sat';
                if (isToday) dayClass = 'current-day';
                html += `<div class="calendar-day ${dayClass}">${d}</div>`;
            }
            html += `</div>`;
            popup.innerHTML = html;
            popup.querySelector('.prevCalBtn').onclick = (e) => { e.stopPropagation(); let nm = month - 1; let ny = year; if (nm < 0) { nm = 11; ny--; } renderCal(ny, nm); };
            popup.querySelector('.nextCalBtn').onclick = (e) => { e.stopPropagation(); let nm = month + 1; let ny = year; if (nm > 11) { nm = 0; ny++; } renderCal(ny, nm); };
        }
        renderCal(currentYear, currentMonth);
        const rect = anchorBtn.getBoundingClientRect();
        popup.style.position = 'fixed';
        popup.style.top = `${rect.bottom + 5}px`;
        popup.style.right = `${window.innerWidth - rect.right + 5}px`;
        document.body.appendChild(popup);
        activeCalendar = popup;
        const closeHandler = (e) => {
            if (!popup.contains(e.target) && e.target !== anchorBtn && !anchorBtn.contains(e.target)) {
                if (activeCalendar) { activeCalendar.remove(); activeCalendar = null; }
                document.removeEventListener('click', closeHandler);
            }
        };
        setTimeout(() => document.addEventListener('click', closeHandler), 100);
    }

    // ==================== ASTRONOMICAL PRAYER TIMES (SALAFI) ====================
    function getPrayerTimes(date, lat, lng, timezoneOffsetHours) {
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let yr = year, mo = month;
        if (mo <= 2) { yr -= 1; mo += 12; }
        const A = Math.floor(yr / 100);
        const B = Math.floor(A / 4);
        const C = 2 - A + B;
        const E = Math.floor(365.25 * (yr + 4716));
        const F = Math.floor(30.6001 * (mo + 1));
        const JD = C + day + E + F - 1524.5;
        
        const D = JD - 2451545.0;
        const g = (357.529 + 0.98560028 * D) % 360;
        const q = (280.459 + 0.98564736 * D) % 360;
        const L = (q + 1.915 * Math.sin(g * Math.PI/180) + 0.020 * Math.sin(2 * g * Math.PI/180)) % 360;
        const e = 23.439 - 0.00000036 * D;
        const RA = Math.atan2(Math.cos(e * Math.PI/180) * Math.sin(L * Math.PI/180), Math.cos(L * Math.PI/180)) * 180/Math.PI / 15;
        const eqt = q/15 - ((RA + 24) % 24);
        const decl = Math.asin(Math.sin(e * Math.PI/180) * Math.sin(L * Math.PI/180)) * 180/Math.PI;
        
        const noonUTC = 12 - lng/15 - eqt;
        const latRad = lat * Math.PI/180;
        const declRad = decl * Math.PI/180;
        const cosHA = (Math.sin(-0.8333 * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const HA = Math.acos(Math.min(1, Math.max(-1, cosHA))) * 180/Math.PI / 15;
        const sunriseUTC = noonUTC - HA;
        const sunsetUTC = noonUTC + HA;
        
        const cosFajr = (Math.sin(-18 * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const fajrHA = Math.acos(Math.min(1, Math.max(-1, cosFajr))) * 180/Math.PI / 15;
        const fajrUTC = noonUTC - fajrHA;
        
        const cosIsha = (Math.sin(-17 * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const ishaHA = Math.acos(Math.min(1, Math.max(-1, cosIsha))) * 180/Math.PI / 15;
        const ishaUTC = noonUTC + ishaHA;
        
        const asrAngle = Math.atan(1 / (1 + Math.tan(Math.abs(latRad - declRad)))) * 180/Math.PI;
        const cosAsr = (Math.sin(asrAngle * Math.PI/180) - Math.sin(latRad) * Math.sin(declRad)) / (Math.cos(latRad) * Math.cos(declRad));
        const asrHA = Math.acos(Math.min(1, Math.max(-1, cosAsr))) * 180/Math.PI / 15;
        const asrUTC = noonUTC + asrHA;
        
        function toLocal(utcHours) {
            let h = utcHours + timezoneOffsetHours;
            h = ((h % 24) + 24) % 24;
            return h;
        }
        function formatTime(hours) {
            let h = Math.floor(hours);
            let m = Math.floor((hours - h) * 60);
            if (m === 60) { m = 0; h += 1; }
            if (h >= 24) h -= 24;
            const ampm = h >= 12 ? 'PM' : 'AM';
            let h12 = h % 12 || 12;
            return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
        }
        
        return {
            fajr: formatTime(toLocal(fajrUTC)),
            sunrise: formatTime(toLocal(sunriseUTC)),
            dhuhr: formatTime(toLocal(noonUTC + 0.5/60)),
            asr: formatTime(toLocal(asrUTC)),
            maghrib: formatTime(toLocal(sunsetUTC + 1/60)),
            isha: formatTime(toLocal(ishaUTC)),
            raw: {
                fajr: toLocal(fajrUTC),
                sunrise: toLocal(sunriseUTC),
                dhuhr: toLocal(noonUTC),
                asr: toLocal(asrUTC),
                maghrib: toLocal(sunsetUTC),
                isha: toLocal(ishaUTC)
            }
        };
    }

    function updateSalahTimer() {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const times = getPrayerTimes(today, PRAYER_LAT, PRAYER_LNG, PRAYER_TIMEZONE);

        document.getElementById('timeFajr').innerText = times.fajr;
        document.getElementById('timeDhuhr').innerText = times.dhuhr;
        document.getElementById('timeAsr').innerText = times.asr;
        document.getElementById('timeMaghrib').innerText = times.maghrib;
        document.getElementById('timeIsha').innerText = times.isha;

        const raw = times.raw;
        const currentHours = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
        
        let activeWakth = null;
        if (currentHours >= raw.fajr && currentHours < raw.dhuhr) activeWakth = 'fajr';
        else if (currentHours >= raw.dhuhr && currentHours < raw.asr) activeWakth = 'dhuhr';
        else if (currentHours >= raw.asr && currentHours < raw.maghrib) activeWakth = 'asr';
        else if (currentHours >= raw.maghrib && currentHours < raw.isha) activeWakth = 'maghrib';
        else if (currentHours >= raw.isha || currentHours < raw.fajr) activeWakth = 'isha';
        
        let isForbiddenNow = false;
        const sunriseH = raw.sunrise;
        if (currentHours >= sunriseH && currentHours < (sunriseH + 20/60)) isForbiddenNow = true;
        const dhuhrH = raw.dhuhr;
        if (currentHours >= (dhuhrH - 10/60) && currentHours < dhuhrH) isForbiddenNow = true;
        const maghribH = raw.maghrib;
        if (currentHours >= (maghribH - 10/60) && currentHours < maghribH) isForbiddenNow = true;

        document.querySelectorAll('.wakth-badge').forEach(el => {
            el.classList.remove('active');
            el.classList.remove('forbidden');
        });
        if (activeWakth) {
            const badge = document.querySelector(`.wakth-badge[data-wakth="${activeWakth}"]`);
            if (badge) badge.classList.add('active');
        }

        if (isForbiddenNow) {
            let targetWakth = null;
            if (currentHours >= sunriseH && currentHours < (sunriseH + 20/60)) targetWakth = 'fajr';
            else if (currentHours >= (dhuhrH - 10/60) && currentHours < dhuhrH) targetWakth = 'dhuhr';
            else if (currentHours >= (maghribH - 10/60) && currentHours < maghribH) targetWakth = 'maghrib';
            if (targetWakth) {
                const badge = document.querySelector(`.wakth-badge[data-wakth="${targetWakth}"]`);
                if (badge) badge.classList.add('forbidden');
            }
        }
    }

            document.getElementById("categoriesContainer").innerHTML = `<div class="empty-cat">Error: ${err.message}</div>`;
            document.getElementById('cacheIndicator').innerHTML = `⚠️ Error`;
        }
        
        updateSalahTimer();
    }
    init();
</script>
</body>
</html>

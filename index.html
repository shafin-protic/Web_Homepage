<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shafin's Space</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000' rx='24'/%3E%3Cpath fill='%233b82f6' d='M30 30h40a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V34a4 4 0 0 1 4-4zm5 12v20h30V42H35z'/%3E%3Ccircle cx='68' cy='36' r='3.5' fill='%23facc15'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }
        .hide-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem 1.5rem;
            gap: 1rem;
            overflow: hidden;
        }
        
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .title-section {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            border: 2px solid #3b82f6;
        }
        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #87CEEB, #ffffff, #87CEEB, #add8e6, #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: skyTitleShine 3s ease-in-out infinite;
            letter-spacing: 1px;
        }
        @keyframes skyTitleShine {
            0% { background-position: 0% center; opacity: 0.85; }
            50% { background-position: 100% center; opacity: 1; }
            100% { background-position: 0% center; opacity: 0.85; }
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            position: relative;
        }
        .clock-date { text-align: right; }
        .clock { font-size: 1.2rem; font-weight: 600; font-family: monospace; }
        .date { font-size: 0.65rem; color: #9ca3af; }
        .icon-btn {
            background: #1f2937;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: #374151; transform: scale(1.05); }
        
        .calendar-popup {
            position: fixed;
            background: #111;
            border: 1px solid #333;
            border-radius: 1rem;
            padding: 1rem;
            width: 320px;
            z-index: 10001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .calendar-header button {
            background: #1f2937;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
        }
        .calendar-header button:hover { background: #374151; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 0.3rem;
        }
        .calendar-weekday { font-size: 0.7rem; color: #9ca3af; padding: 0.3rem; }
        .calendar-day {
            padding: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 0.5rem;
            position: relative;
        }
        .calendar-day:hover { background: #1f2937; }
        .friday-sat { color: #ef4444; }
        .current-day { background: #3b82f6; color: white; }
        
        /* Centered web search bar - hidden on mobile */
        .search-wrapper {
            display: flex;
            justify-content: center;
            flex-shrink: 0;
            padding: 0.5rem 0;
        }
        .search-container {
            display: flex;
            align-items: center;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 2.5rem;
            padding: 0.3rem 0.5rem;
            transition: all 0.2s;
            width: 100%;
            max-width: 720px;
            position: relative;
        }
        .search-container:focus-within {
            border-color: #3b82f6;
            background: #050505;
        }
        .engine-icon-display {
            background: transparent;
            border: none;
            margin-left: 0.3rem;
            margin-right: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 2rem;
            transition: 0.2s;
            position: relative;
            z-index: 5;
        }
        .engine-icon-display:hover {
            background: #1f2937;
        }
        .engine-icon-display img {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            pointer-events: none;
        }
        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 0.6rem 0.8rem;
            outline: none;
            min-width: 0;
        }
        .search-container input::placeholder { color: #4b5563; }
        .search-container button {
            background: #0d9488;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .search-container button:hover { background: #0f766e; }
        
        .dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 1rem;
            z-index: 1000;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            text-decoration: none;
            color: #e5e7eb;
            transition: 0.1s;
        }
        .dropdown-item:hover { background: #1f2937; }
        .dropdown-item img { width: 20px; height: 20px; border-radius: 4px; }

        .categories-section {
            flex: 1;
            overflow-y: auto;
        }
        .category-row { margin-bottom: 1.5rem; }
        .category-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 0.6rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.7rem;
        }
        .equal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 0.8rem;
            width: 100%;
        }
        .clean-app-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.15s;
            background: transparent;
            padding: 0.3rem;
        }
        .clean-app-tile:hover { transform: translateY(-3px); }
        .direct-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.3rem;
        }
        .direct-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .clean-app-tile span {
            font-size: 0.6rem;
            font-weight: 500;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #bbbbbb;
        }
        .empty-cat { color: #4b5563; font-size: 0.85rem; padding: 1rem; text-align: center; }
        .cache-indicator {
            position: fixed;
            bottom: 8px;
            right: 8px;
            font-size: 0.6rem;
            color: #4b5563;
            background: #0a0a0a;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 999;
        }

        @media (max-width: 768px) {
            .app { padding: 0.8rem 1rem; gap: 0.8rem; }
            .page-title h1 { font-size: 1.2rem; }
            .profile-img { width: 32px; height: 32px; }
            .clock { font-size: 0.9rem; }
            .date { font-size: 0.5rem; }
            .header-right { gap: 0.4rem; }
            .icon-btn { width: 28px; height: 28px; font-size: 0.7rem; }
            .search-wrapper { display: none; }
            .categories-section { padding-top: 0.5rem; }
            .category-title { font-size: 0.75rem; }
            .clean-app-tile { padding: 0.2rem; }
            .direct-icon { width: 32px; height: 32px; }
            .clean-app-tile span { font-size: 0.5rem; }
            .equal-grid { gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(55px, 1fr)); }
        }
        @media (max-width: 480px) {
            .app { padding: 0.5rem 0.6rem; gap: 0.5rem; }
            .page-title h1 { font-size: 1rem; }
            .profile-img { width: 28px; height: 28px; }
            .clock { font-size: 0.7rem; }
            .date { font-size: 0.45rem; }
            .icon-btn { width: 24px; height: 24px; font-size: 0.6rem; }
            .equal-grid { grid-template-columns: repeat(auto-fit, minmax(45px, 1fr)); gap: 0.3rem; }
            .direct-icon { width: 28px; height: 28px; }
            .clean-app-tile span { font-size: 0.45rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header-row">
        <div class="title-section">
            <img class="profile-img" id="profileImage" src="https://i.postimg.cc/yYbyhL4w/Rounded-Profile.png" alt="Profile" onerror="this.onerror=null; this.style.display='none'; document.getElementById('fallbackIcon').style.display='flex';">
            <div id="fallbackIcon" style="display: none; width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; align-items: center; justify-content: center;">
                <i class="fas fa-user" style="color: white; font-size: 1.2rem;"></i>
            </div>
            <div class="page-title"><h1>Shafin's Space</h1></div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="editSheetBtn" title="Edit Google Sheet"><i class="fas fa-pen"></i></button>
            <button class="icon-btn" id="refreshCsvBtn" title="Refresh All Data"><i class="fas fa-sync-alt"></i></button>
            <button class="icon-btn" id="calendarBtn" title="Calendar"><i class="fas fa-calendar-alt"></i></button>
            <div class="clock-date">
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="date" id="dateDisplay">Loading...</div>
            </div>
        </div>
    </div>
    
    <!-- Centered Web Search Bar -->
    <div class="search-wrapper">
        <div class="search-container" id="searchContainer">
            <button class="engine-icon-display" id="engineSelectorBtn" aria-label="Select search engine">
                <img id="currentEngineIcon" src="https://www.google.com/s2/favicons?domain=google.com" alt="Search engine">
            </button>
            <input type="text" id="engineQueryInput" placeholder="Search the web...">
            <button id="engineSearchBtn"><i class="fas fa-search"></i></button>
            <div id="engineDropdown" class="dropdown"></div>
        </div>
    </div>

    <div class="categories-section hide-scrollbar" id="categoriesContainer">
        <div class="empty-cat">Loading categories...</div>
    </div>
    <div class="cache-indicator" id="cacheIndicator">Starting...</div>
</div>

<script>
    // ==================== CONFIGURATION ====================
    const CSV_BOOKMARKS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=26452786&single=true&output=csv";
    const SEARCH_ENGINES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxVk_HHPGsnAkM1qeSshRjzRXQ7BhKbk2OFTy-nurrhUQSCd7lz3LFOahHU_nqYd9OIxIu5wkzXEZZ/pub?gid=1271015321&single=true&output=csv";
    const EDIT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1ErgYkvSzc1CtNPGYAjMV4TeQqMH6tEV-l7DPT6faBPQ/edit?usp=sharing";
    
    const CACHE_KEY_CATEGORIES = 'shafin_categories_v3';
    const CACHE_KEY_SEARCH_ENGINES = 'shafin_search_engines_v3';
    const CACHE_DURATION = 24 * 60 * 60 * 1000;
    
    let csvCategoryBookmarks = [];
    let searchEngines = [];
    let currentEngine = null;
    let isDropdownOpen = false;
    
    function escapeHtml(str) { 
        if (!str) return '';
        return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    
    function getFaviconUrl(url) {
        try { const domain = new URL(url).hostname; return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`; } catch(e) { return ""; }
    }
    
    async function fetchCSV(url, cacheKey, forceRefresh = false) {
        if (!forceRefresh) {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) {
                        return data;
                    }
                } catch(e) {}
            }
        }
        const res = await fetch(url);
        const text = await res.text();
        localStorage.setItem(cacheKey, JSON.stringify({ data: text, timestamp: Date.now() }));
        return text;
    }
    
    async function loadCsvCategoryBookmarks(forceRefresh = false) {
        try {
            const text = await fetchCSV(CSV_BOOKMARKS_URL, CACHE_KEY_CATEGORIES, forceRefresh);
            const rows = text.split(/\r?\n/).filter(l => l.trim());
            const data = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const parts = [];
                let inQuote = false;
                let current = '';
                for (let c of row) {
                    if (c === '"') { inQuote = !inQuote; }
                    else if (c === ',' && !inQuote) { parts.push(current); current = ''; }
                    else { current += c; }
                }
                parts.push(current);
                if (parts.length >= 4) {
                    let name = parts[0].replace(/^"|"$/g, '');
                    let url = parts[1].replace(/^"|"$/g, '');
                    let category = parts[2] ? parts[2].replace(/^"|"$/g, '') : "Uncategorized";
                    let customIcon = parts[3] ? parts[3].replace(/^"|"$/g, '') : "";
                    if (name && url && url.startsWith("http")) {
                        data.push({ name, url, category: category.trim(), customIcon });
                    }
                } else if (parts.length >= 3) {
                    let name = parts[0].replace(/^"|"$/g, '');
                    let url = parts[1].replace(/^"|"$/g, '');
                    let category = parts[2] ? parts[2].replace(/^"|"$/g, '') : "Uncategorized";
                    if (name && url && url.startsWith("http")) {
                        data.push({ name, url, category: category.trim(), customIcon: "" });
                    }
                }
            }
            return data;
        } catch(e) { console.error(e); return []; }
    }
    
    async function loadSearchEngines(forceRefresh = false) {
        try {
            const text = await fetchCSV(SEARCH_ENGINES_URL, CACHE_KEY_SEARCH_ENGINES, forceRefresh);
            const rows = text.split(/\r?\n/).filter(l => l.trim());
            const engines = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const parts = [];
                let inQuote = false;
                let current = '';
                for (let c of row) {
                    if (c === '"') { inQuote = !inQuote; }
                    else if (c === ',' && !inQuote) { parts.push(current); current = ''; }
                    else { current += c; }
                }
                parts.push(current);
                if (parts.length >= 4) {
                    let name = parts[0].replace(/^"|"$/g, '');
                    let urlTemplate = parts[1].replace(/^"|"$/g, '');
                    let useIt = parts[2]?.toLowerCase().replace(/^"|"$/g, '');
                    let icon = parts[3]?.replace(/^"|"$/g, '');
                    if (urlTemplate && !urlTemplate.includes("%s")) {
                        urlTemplate += urlTemplate.includes("?") ? "&q=%s" : "?q=%s";
                    }
                    const active = (useIt === "yes" || useIt === "y" || useIt === "true");
                    engines.push({ name, urlTemplate, active, customIcon: icon });
                } else if (parts.length >= 3) {
                    let name = parts[0].replace(/^"|"$/g, '');
                    let urlTemplate = parts[1].replace(/^"|"$/g, '');
                    let useIt = parts[2]?.toLowerCase().replace(/^"|"$/g, '');
                    if (urlTemplate && !urlTemplate.includes("%s")) {
                        urlTemplate += urlTemplate.includes("?") ? "&q=%s" : "?q=%s";
                    }
                    const active = (useIt === "yes" || useIt === "y" || useIt === "true");
                    engines.push({ name, urlTemplate, active, customIcon: "" });
                }
            }
            if (engines.length === 0) engines.push({ name: "Google", urlTemplate: "https://www.google.com/search?q=%s", active: true, customIcon: "" });
            return engines;
        } catch(e) { return [{ name: "Google", urlTemplate: "https://www.google.com/search?q=%s", active: true, customIcon: "" }]; }
    }
    
    function renderCategories() {
        const container = document.getElementById("categoriesContainer");
        const categories = ["Cat A", "Cat B", "Cat C", "Cat D", "Cat E"];
        const grouped = { "Cat A": [], "Cat B": [], "Cat C": [], "Cat D": [], "Cat E": [] };
        csvCategoryBookmarks.forEach(b => { if (grouped[b.category]) grouped[b.category].push(b); });
        let html = "", hasAny = false;
        for (let cat of categories) {
            const items = grouped[cat];
            if (items.length === 0) continue;
            hasAny = true;
            html += `<div class="category-row"><div class="category-title">${cat}</div><div class="equal-grid">`;
            for (const item of items) {
                let iconUrl = item.customIcon && item.customIcon.startsWith('http') ? item.customIcon : getFaviconUrl(item.url);
                html += `<a href="${escapeHtml(item.url)}" target="_blank" class="clean-app-tile">
                            <div class="direct-icon">
                                <img src="${iconUrl}" width="40" height="40" onerror="this.src='${getFaviconUrl(item.url)}';">
                            </div>
                            <span>${escapeHtml(item.name.length > 14 ? item.name.slice(0,12)+'..' : item.name)}</span>
                         </a>`;
            }
            html += `</div></div>`;
        }
        if (!hasAny) html = '<div class="empty-cat">No categories found. Add bookmarks with Cat A, Cat B, etc.</div>';
        container.innerHTML = html;
    }
    
    function renderEngineDropdown() {
        const dropdown = document.getElementById("engineDropdown");
        let html = "";
        searchEngines.forEach(eng => {
            let iconUrl = eng.customIcon && eng.customIcon.startsWith('http') ? eng.customIcon : getFaviconUrl(eng.urlTemplate);
            html += `<div class="dropdown-item" data-name="${escapeHtml(eng.name)}">
                        <img src="${iconUrl}" style="width:20px;height:20px;" onerror="this.src='${getFaviconUrl(eng.urlTemplate)}';"> 
                        ${eng.name}
                     </div>`;
        });
        dropdown.innerHTML = html;
        
        // Re-bind click events for dropdown items
        document.querySelectorAll("#engineDropdown .dropdown-item").forEach(el => {
            el.addEventListener("click", function(e) {
                e.stopPropagation();
                const name = this.getAttribute("data-name");
                const engine = searchEngines.find(e => e.name === name);
                if (engine) {
                    searchEngines.forEach(e => e.active = false);
                    engine.active = true;
                    currentEngine = engine;
                    updateEngineIcon();
                    closeDropdown();
                }
            });
        });
    }
    
    function updateEngineIcon() {
        if (currentEngine) {
            let iconUrl = currentEngine.customIcon && currentEngine.customIcon.startsWith('http') ? currentEngine.customIcon : getFaviconUrl(currentEngine.urlTemplate);
            document.getElementById("currentEngineIcon").src = iconUrl;
        }
    }
    
    function toggleDropdown(e) {
        e.stopPropagation();
        const dropdown = document.getElementById("engineDropdown");
        if (dropdown.style.display === "block") {
            dropdown.style.display = "none";
            isDropdownOpen = false;
        } else {
            // Re-render dropdown to ensure fresh content
            renderEngineDropdown();
            dropdown.style.display = "block";
            isDropdownOpen = true;
        }
    }
    
    function closeDropdown() {
        const dropdown = document.getElementById("engineDropdown");
        dropdown.style.display = "none";
        isDropdownOpen = false;
    }
    
    function performSearch() {
        const query = document.getElementById("engineQueryInput").value;
        if (!query.trim()) return;
        const engine = currentEngine || searchEngines[0];
        window.open(engine.urlTemplate.replace("%s", encodeURIComponent(query)), "_blank");
    }
    
    let activeCalendar = null;
    function showCalendarPopup(anchorBtn) {
        if (activeCalendar) { activeCalendar.remove(); activeCalendar = null; return; }
        const popup = document.createElement('div');
        popup.className = 'calendar-popup';
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        
        function renderCal(year, month) {
            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let html = `<div class="calendar-header"><button class="prevCalBtn"><i class="fas fa-chevron-left"></i></button><span class="calMonthYear">${firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span><button class="nextCalBtn"><i class="fas fa-chevron-right"></i></button></div><div class="calendar-grid">`;
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            weekdays.forEach(d => html += `<div class="calendar-weekday">${d}</div>`);
            for (let i = 0; i < startDay; i++) html += `<div></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dayOfWeek = (startDay + d - 1) % 7;
                const isFriSat = dayOfWeek === 5 || dayOfWeek === 6;
                const isToday = d === new Date().getDate() && year === new Date().getFullYear() && month === new Date().getMonth();
                let dayClass = '';
                if (isFriSat) dayClass = 'friday-sat';
                if (isToday) dayClass = 'current-day';
                html += `<div class="calendar-day ${dayClass}">${d}</div>`;
            }
            html += `</div>`;
            popup.innerHTML = html;
            popup.querySelector('.prevCalBtn').onclick = (e) => { e.stopPropagation(); let nm = month - 1; let ny = year; if (nm < 0) { nm = 11; ny--; } renderCal(ny, nm); };
            popup.querySelector('.nextCalBtn').onclick = (e) => { e.stopPropagation(); let nm = month + 1; let ny = year; if (nm > 11) { nm = 0; ny++; } renderCal(ny, nm); };
        }
        renderCal(currentYear, currentMonth);
        const rect = anchorBtn.getBoundingClientRect();
        popup.style.position = 'fixed';
        popup.style.top = `${rect.bottom + 5}px`;
        popup.style.right = `${window.innerWidth - rect.right + 5}px`;
        document.body.appendChild(popup);
        activeCalendar = popup;
        const closeHandler = (e) => {
            if (!popup.contains(e.target) && e.target !== anchorBtn && !anchorBtn.contains(e.target)) {
                if (activeCalendar) { activeCalendar.remove(); activeCalendar = null; }
                document.removeEventListener('click', closeHandler);
            }
        };
        setTimeout(() => document.addEventListener('click', closeHandler), 100);
    }
    
    function updateClock() {
        const now = new Date();
        let hours = now.getHours() % 12 || 12;
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        const minutes = String(now.getMinutes()).padStart(2,'0');
        const seconds = String(now.getSeconds()).padStart(2,'0');
        document.getElementById("clockDisplay").innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById("dateDisplay").innerText = now.toLocaleDateString('en-US', options);
    }
    
    async function refreshAll() {
        document.getElementById('cacheIndicator').innerHTML = '🔄 Refreshing...';
        const [newCategories, newEngines] = await Promise.all([
            loadCsvCategoryBookmarks(true),
            loadSearchEngines(true)
        ]);
        csvCategoryBookmarks = newCategories;
        searchEngines = newEngines;
        renderCategories();
        renderEngineDropdown();
        updateEngineIcon();
        document.getElementById('cacheIndicator').innerHTML = `✅ Updated ${new Date().toLocaleTimeString()}`;
        setTimeout(() => { if(document.getElementById('cacheIndicator').innerHTML.includes('Updated')) document.getElementById('cacheIndicator').innerHTML = `📚 Cached`; }, 2000);
    }
    
    // ==================== EVENT BINDING ====================
    document.getElementById("calendarBtn").addEventListener("click", (e) => { e.stopPropagation(); showCalendarPopup(e.currentTarget); });
    document.getElementById("editSheetBtn").addEventListener("click", () => { window.open(EDIT_SHEET_URL, "_blank"); });
    document.getElementById("refreshCsvBtn").addEventListener("click", refreshAll);
    document.getElementById("engineSearchBtn").addEventListener("click", performSearch);
    document.getElementById("engineQueryInput").addEventListener("keypress", e => { if (e.key === "Enter") performSearch(); });
    
    // Engine selector click to toggle dropdown
    document.getElementById("engineSelectorBtn").addEventListener("click", toggleDropdown);
    
    // Click outside to close dropdown
    document.addEventListener("click", function(e) {
        const container = document.getElementById("searchContainer");
        const dropdown = document.getElementById("engineDropdown");
        if (container && !container.contains(e.target)) {
            dropdown.style.display = "none";
            isDropdownOpen = false;
        }
    });
    
    setInterval(updateClock, 1000);
    updateClock();
    
    // ==================== INIT ====================
    async function init() {
        try {
            document.getElementById('cacheIndicator').innerHTML = '📦 Loading...';
            
            const [categories, engines] = await Promise.all([
                loadCsvCategoryBookmarks(false),
                loadSearchEngines(false)
            ]);
            
            csvCategoryBookmarks = categories;
            searchEngines = engines;
            
            if (!searchEngines.some(e => e.active)) searchEngines[0].active = true;
            currentEngine = searchEngines.find(e => e.active);
            updateEngineIcon();
            
            renderCategories();
            renderEngineDropdown();
            
            document.getElementById('cacheIndicator').innerHTML = `✅ Ready (${csvCategoryBookmarks.length} items)`;
            setTimeout(() => { if(document.getElementById('cacheIndicator').innerHTML.includes('Ready')) document.getElementById('cacheIndicator').innerHTML = `📚 Cached`; }, 2000);
            
            const profileImg = document.getElementById("profileImage");
            if (profileImg.complete && profileImg.naturalHeight === 0) {
                profileImg.style.display = 'none';
                document.getElementById('fallbackIcon').style.display = 'flex';
            }
        } catch(err) { 
            console.error(err); 
            document.getElementById("categoriesContainer").innerHTML = `<div class="empty-cat">Error: ${err.message}</div>`;
            document.getElementById('cacheIndicator').innerHTML = `⚠️ Error`;
        }
    }
    init();
</script>
</body>
</html>
